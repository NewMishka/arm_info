name: Ошибка
description: Сообщить о неправильной работе arm_info
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Перед публикацией отчёта используйте `--privacy`."
  - type: input
    id: version
    attributes:
      label: Версия arm_info
      placeholder: "1.1.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: ОС
      placeholder: "РЕД ОС 8.x"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Что произошло
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Обезличенный фрагмент отчёта
      description: "Только вывод с --privacy; удалите лишние внутренние данные."

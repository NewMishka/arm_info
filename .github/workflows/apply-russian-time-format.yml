name: Apply Russian duration formatting cleanup

on:
  push:
    branches:
      - feature/v1.2.4-command-audit
    paths:
      - .github/workflows/apply-russian-time-format.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v1.2.4-command-audit
          fetch-depth: 0
      - name: Apply patch
        run: |
          python3 tools/apply-russian-time-format.py
          bash -n arm_info.sh
          bash tests/test_cli.sh
      - name: Commit cleanup
        run: |
          git config user.name arm_info-ci
          git config user.email 157384758+NewMishka@users.noreply.github.com
          git rm .github/workflows/apply-russian-time-format.yml tools/apply-russian-time-format.py
          git add arm_info.sh tests/test_cli.sh docs/releases/v1.2.4.md
          git commit -m "fix: localize uptime and deduplicate system age"
          git push origin HEAD:feature/v1.2.4-command-audit

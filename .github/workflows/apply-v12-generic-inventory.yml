name: Apply v1.2 generic inventory patch

on:
  push:
    branches:
      - feature/enterprise-profiles-v1.2.0
    paths:
      - tools/patch-v12-generic-inventory.py
      - .github/workflows/apply-v12-generic-inventory.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 tools/patch-v12-generic-inventory.py
      - name: Validate syntax
        run: bash -n arm_info.sh arm_info-enterprise.sh tests/test_enterprise.sh
      - name: Regression tests
        run: bash tests/test_enterprise.sh
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add arm_info-enterprise.sh README.md docs/ENTERPRISE_PROFILES.md CHANGELOG.md tests/test_enterprise.sh
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "refactor: generic Kerberos errors and global software inventory"
          git push

name: Apply v1.2 base recommendations

on:
  push:
    branches:
      - feature/enterprise-profiles-v1.2.0
    paths:
      - tools/patch-v12-base-recommendations.py
      - .github/workflows/apply-v12-base-recommendations.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix generated case patterns and apply patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/patch-v12-base-recommendations.py')
          s=p.read_text(encoding='utf-8')
          replacements={
              '*ОЗУ*|*запас ОЗУ*)':'*ОЗУ*|*запас\\ ОЗУ*)',
              '*аппаратные/дисковые ошибки*)':'*аппаратные/дисковые\\ ошибки*)',
              '*температура CPU*)':'*температура\\ CPU*)',
              '*системная нагрузка*)':'*системная\\ нагрузка*)',
              '*активный IPv4-интерфейс*)':'*активный\\ IPv4-интерфейс*)',
              '*маршрут по умолчанию*)':'*маршрут\\ по\\ умолчанию*)',
              '*DNS-серверы не определены*)':'*DNS-серверы\\ не\\ определены*)',
              '*сетевых ошибок/дропов*)':'*сетевых\\ ошибок/дропов*)',
              '*время не синхронизировано*)':'*время\\ не\\ синхронизировано*)',
              '*аварийного завершения*)':'*аварийного\\ завершения*)',
          }
          for a,b in replacements.items():
              s=s.replace(a,b)
          p.write_text(s,encoding='utf-8')
          PY
          python3 tools/patch-v12-base-recommendations.py
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Validate
        run: |
          bash -n arm_info.sh arm_info-enterprise.sh install.sh tests/test_cli.sh tests/test_enterprise.sh packaging/build-rpm.sh
          shellcheck --severity=error arm_info.sh arm_info-enterprise.sh install.sh tests/test_cli.sh tests/test_enterprise.sh packaging/build-rpm.sh
          bash tests/test_cli.sh
          bash tests/test_enterprise.sh
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add arm_info.sh tests/test_cli.sh
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "feat: enrich base diagnostic recommendations"
          git push

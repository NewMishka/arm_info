name: Apply v1.2.3 storage priority

on:
  push:
    branches:
      - feature/v1.2.3-system-storage-priority
    paths:
      - '.github/scripts/apply_v1_2_3_storage_priority.py'
      - '.github/workflows/apply-v1.2.3-storage-priority.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v1.2.3-system-storage-priority
      - name: Apply patch
        run: python3 .github/scripts/apply_v1_2_3_storage_priority.py
      - name: Validate syntax and tests
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y shellcheck >/dev/null
          bash -n arm_info.sh install.sh tests/test_cli.sh tests/test_enterprise.sh packaging/build-rpm.sh
          shellcheck --severity=error arm_info.sh install.sh tests/test_cli.sh tests/test_enterprise.sh packaging/build-rpm.sh
          bash tests/test_cli.sh
          bash tests/test_enterprise.sh
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add arm_info.sh VERSION packaging/arm_info.spec CHANGELOG.md README.md docs examples tests
          git diff --cached --quiet && exit 0
          git commit -m 'feat: prioritize system storage in v1.2.3'
          git push

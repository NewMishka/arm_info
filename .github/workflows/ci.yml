name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  bash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Syntax
        run: bash -n arm_info.sh arm_info-enterprise.sh install.sh tests/test_cli.sh tests/test_enterprise.sh packaging/build-rpm.sh
      - name: ShellCheck
        run: shellcheck --severity=error arm_info.sh arm_info-enterprise.sh install.sh tests/test_cli.sh tests/test_enterprise.sh packaging/build-rpm.sh
      - name: Base CLI tests
        run: bash tests/test_cli.sh
      - name: Enterprise profile tests
        run: bash tests/test_enterprise.sh

  compatibility-syntax:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - ubuntu:24.04
          - fedora:latest
          - rockylinux:9
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax in ${{ matrix.image }}
        run: docker run --rm -v "$PWD:/src:ro" "${{ matrix.image }}" bash -c 'bash -n /src/arm_info.sh && bash -n /src/arm_info-enterprise.sh'

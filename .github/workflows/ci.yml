name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  bash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Syntax
        run: bash -n arm_info.sh install.sh tests/test_cli.sh tests/test_enterprise.sh tests/test_mail_profile.sh tests/test_recommendation_commands.sh tests/test_sections.sh tests/test_cifs_probe.sh packaging/build-rpm.sh
      - name: ShellCheck
        run: shellcheck --severity=error arm_info.sh install.sh tests/test_cli.sh tests/test_enterprise.sh tests/test_mail_profile.sh tests/test_recommendation_commands.sh tests/test_sections.sh tests/test_cifs_probe.sh packaging/build-rpm.sh
      - name: Rendering and query-cache regression tests
        run: |
          bash -n tests/test_stage1_performance.sh tests/render_cases.sh
          shellcheck --severity=error tests/test_stage1_performance.sh tests/render_cases.sh
          bash tests/test_stage1_performance.sh
      - name: Bounded network and concurrency regression tests
        run: |
          bash -n tests/test_stage2_limits.sh
          shellcheck --severity=error tests/test_stage2_limits.sh
          bash tests/test_stage2_limits.sh
      - name: Mail profile regression tests
        run: bash tests/test_mail_profile.sh
      - name: Base CLI tests
        run: bash tests/test_cli.sh
      - name: Enterprise profile tests
        run: bash tests/test_enterprise.sh
      - name: Enterprise discovery regression tests
        run: |
          bash -n tests/test_enterprise_discovery.sh
          shellcheck --severity=error tests/test_enterprise_discovery.sh
          bash tests/test_enterprise_discovery.sh
          sudo bash tests/test_enterprise_discovery.sh
      - name: Recommendation command audit tests
        run: bash tests/test_recommendation_commands.sh
      - name: Full report section coverage
        run: bash tests/test_sections.sh
      - name: CIFS runtime probe regression tests
        run: bash tests/test_cifs_probe.sh

  compatibility-syntax:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - ubuntu:24.04
          - fedora:latest
          - rockylinux:9
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax in ${{ matrix.image }}
        run: docker run --rm -v "$PWD:/src:ro" "${{ matrix.image }}" bash -c 'bash -n /src/arm_info.sh'

  release-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version consistency
        run: |
          V=$(tr -d '[:space:]' < VERSION)
          test "$V" = "$(sed -n 's/^ARM_INFO_VERSION="\([^"]*\)"/\1/p' arm_info.sh | head -1)"
          test "$V" = "$(awk '/^Version:/{print $2; exit}' packaging/arm_info.spec)"
          test "$V" = "$(make -s version)"
          grep -q "Текущая версия: \*\*$V\*\*" README.md
          grep -q "^## $V" CHANGELOG.md
          test -f "docs/releases/v${V}.md"
      - name: Installer smoke test
        run: |
          D=$(mktemp -d)
          bash install.sh --destdir "$D"
          test -x "$D/usr/local/sbin/arm_info"
          "$D/usr/local/sbin/arm_info" --version
          "$D/usr/local/sbin/arm_info" --profile domain --help >/dev/null
          "$D/usr/local/sbin/arm_info" -c --help >/dev/null
          bash install.sh --destdir "$D" --uninstall
          test ! -e "$D/usr/local/sbin/arm_info"
      - name: Single-file policy checks
        run: |
          V=$(tr -d '[:space:]' < VERSION)
          test ! -e arm_info-enterprise.sh
          grep -q "enterprise-profile-dispatch-v${V}" arm_info.sh
          grep -q 'enterprise) check_domain; check_network; check_print; check_mail ;;' arm_info.sh
          ! grep -Eiq '(r7|remmina|freerdp|icaclient|citrix|basis|workplace|bsscrypto|cryptopro|cprocsp|jacarta|snx)' arm_info.sh
          ! grep -Eq 'Kerberos 6/7/15|c6=|c7=|c15=' arm_info.sh
      - name: Report and documentation contract
        run: |
          grep -Fq 'Температура CPU|${CPU_TEMP}°C (медиана)' arm_info.sh
          ! grep -Fq '(медиана; максимум ${CPU_TEMP_MAX}°C)' arm_info.sh
          grep -Fq 'ARM_INFO_${CORP_TAG}_PRIVATE_' arm_info.sh
          grep -Fq 'SAVE_REPORT=0' arm_info.sh
          grep -Fq -- '-s|--save) SAVE_REPORT=1' arm_info.sh
          grep -Fq -- '-c|--corp) PROFILE=enterprise' arm_info.sh
          grep -Fq -- '-c|--corp|--profile' arm_info.sh
          grep -Fq -- '-c, --corp' README.md
          grep -q 'split_rec_commands' arm_info.sh
          grep -q 'СТАБИЛЬНОСТЬ СИСТЕМЫ' arm_info.sh
          grep -q 'для оценки и пользовательского отчёта используется медиана' docs/SCORING.md
          grep -q 'Стабильность системы' docs/SCORING.md
          grep -q -- '--corp --save' docs/USAGE.md
          ! grep -q -- '--no-save' docs/USAGE.md
          grep -q 'schema v2' docs/AUTOMATION.md
          grep -q 'COMMANDS.md' README.md
          grep -q 'ИЗМЕНЯЕТ СОСТОЯНИЕ' docs/COMMANDS.md
          grep -q 'SHA256SUMS' .github/workflows/release.yml
          grep -q 'SHA256SUMS' docs/releases/v$(tr -d '[:space:]' < VERSION).md
          test -f tests/test_sections.sh
          test -f tests/test_cifs_probe.sh
          grep -q 'Full report section coverage' .github/workflows/ci.yml
          grep -q 'CIFS runtime probe regression tests' .github/workflows/ci.yml
      - name: RPM build smoke test
        run: |
          docker run --rm -v "$PWD:/src:ro" fedora:latest bash -lc '
            dnf -q -y install rpm-build coreutils >/dev/null &&
            cd /src &&
            RPM_TOPDIR=/tmp/rpmbuild bash packaging/build-rpm.sh &&
            RPM=$(find /tmp/rpmbuild/RPMS -type f -name "arm-info-*.rpm" | head -1) &&
            test -n "$RPM" &&
            rpm -qpl "$RPM" | grep -Eq "/usr/(s)?bin/arm_info$" &&
            ! rpm -qpl "$RPM" | grep -q "arm_info-enterprise.sh"
          '

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  bash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Syntax
        run: bash -n arm_info.sh install.sh tests/test_cli.sh tests/test_enterprise.sh packaging/build-rpm.sh
      - name: ShellCheck
        run: shellcheck --severity=error arm_info.sh install.sh tests/test_cli.sh tests/test_enterprise.sh packaging/build-rpm.sh
      - name: Base CLI tests
        run: bash tests/test_cli.sh
      - name: Enterprise profile tests
        run: bash tests/test_enterprise.sh

  compatibility-syntax:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - ubuntu:24.04
          - fedora:latest
          - rockylinux:9
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax in ${{ matrix.image }}
        run: docker run --rm -v "$PWD:/src:ro" "${{ matrix.image }}" bash -c 'bash -n /src/arm_info.sh'

  release-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version consistency
        run: |
          V=$(tr -d '[:space:]' < VERSION)
          test "$V" = "$(sed -n 's/^ARM_INFO_VERSION="\([^"]*\)"/\1/p' arm_info.sh | head -1)"
          test "$V" = "$(awk '/^Version:/{print $2; exit}' packaging/arm_info.spec)"
          grep -q "Текущая версия: \*\*$V\*\*" README.md
      - name: Installer smoke test
        run: |
          D=$(mktemp -d)
          bash install.sh --destdir "$D"
          test -x "$D/usr/local/sbin/arm_info"
          "$D/usr/local/sbin/arm_info" --version
          "$D/usr/local/sbin/arm_info" --profile domain --help >/dev/null
          bash install.sh --destdir "$D" --uninstall
          test ! -e "$D/usr/local/sbin/arm_info"
      - name: Single-file policy checks
        run: |
          V=$(tr -d '[:space:]' < VERSION)
          test ! -e arm_info-enterprise.sh
          grep -q "enterprise-profile-dispatch-v${V}" arm_info.sh
          grep -q 'enterprise) check_domain; check_network; check_print ;;' arm_info.sh
          ! grep -Eiq '(r7|remmina|freerdp|icaclient|citrix|basis|workplace|bsscrypto|cryptopro|cprocsp|jacarta|snx)' arm_info.sh
          ! grep -Eq 'Kerberos 6/7/15|c6=|c7=|c15=' arm_info.sh
      - name: RPM build smoke test
        run: |
          docker run --rm -v "$PWD:/src:ro" fedora:latest bash -lc '
            dnf -q -y install rpm-build coreutils >/dev/null &&
            cd /src &&
            RPM_TOPDIR=/tmp/rpmbuild bash packaging/build-rpm.sh &&
            RPM=$(find /tmp/rpmbuild/RPMS -type f -name "arm-info-*.rpm" | head -1) &&
            test -n "$RPM" &&
            rpm -qpl "$RPM" | grep -Eq "/usr/(s)?bin/arm_info$" &&
            ! rpm -qpl "$RPM" | grep -q "arm_info-enterprise.sh"
          '

name: Apply v1.2.4 command audit

on:
  push:
    branches: [feature/v1.2.4-command-audit]
    paths:
      - .github/workflows/apply-v1.2.4-command-audit.yml
      - .github/scripts/apply_v1_2_4_command_audit.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v1.2.4-command-audit
      - name: Apply command audit patch
        run: python3 .github/scripts/apply_v1_2_4_command_audit.py
      - name: Make test executable
        run: chmod +x tests/test_recommendation_commands.sh
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Validate
        run: |
          bash -n arm_info.sh install.sh tests/test_cli.sh tests/test_enterprise.sh tests/test_recommendation_commands.sh packaging/build-rpm.sh
          shellcheck --severity=error arm_info.sh install.sh tests/test_cli.sh tests/test_enterprise.sh tests/test_recommendation_commands.sh packaging/build-rpm.sh
          bash tests/test_cli.sh
          bash tests/test_enterprise.sh
          bash tests/test_recommendation_commands.sh
          make check
      - name: Commit
        run: |
          git config user.name NewMishka
          git config user.email '157384758+NewMishka@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'arm_info 1.2.4: audit recommendation commands'
          git push origin HEAD:feature/v1.2.4-command-audit

# rerun after Kerberos recommendation test fix

name: Apply explicit save contract v2

on:
  push:
    branches: [feature/v1.2.4-command-audit]
    paths:
      - .github/workflows/apply-save-opt-in-v2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v1.2.4-command-audit
          fetch-depth: 0
      - name: Apply save contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def rep(s, old, new, label, count=None):
              n=s.count(old)
              if n==0: raise SystemExit(f'{label}: source not found')
              if count is not None and n!=count: raise SystemExit(f'{label}: expected {count}, got {n}')
              return s.replace(old,new)

          p=Path('arm_info.sh')
          s=p.read_text(encoding='utf-8')
          s=s.replace('# Результат одновременно выводится на экран и сохраняется в TXT.', '# Результат выводится на экран; сохранение выполняется только по -s/--save.')
          s=rep(s,'\nSAVE_REPORT=1\n','\nSAVE_REPORT=0\n','save defaults',2)
          for profile in ('domain','network','print','software'):
              s=s.replace(f'arm_info --profile {profile} [--privacy] [--json] [-o FILE]',f'arm_info --profile {profile} [--privacy] [--json] [-s|--save] [-o FILE]')
          s=s.replace('arm_info --corp [--privacy] [--json] [--no-save] [-o FILE]','arm_info --corp [--privacy] [--json] [-s|--save] [-o FILE]')
          s=s.replace('arm_info --profile enterprise [--privacy] [--json] [--no-save] [-o FILE]','arm_info --profile enterprise [--privacy] [--json] [-s|--save] [-o FILE]')
          s=s.replace('arm_info --compare REPORT_A.json REPORT_B.json [--json] [-o FILE]','arm_info --compare REPORT_A.json REPORT_B.json [--json] [-s|--save] [-o FILE]')
          s=rep(s,'        --no-save) SAVE_REPORT=0; shift ;;','        -s|--save) SAVE_REPORT=1; shift ;;','save switches',2)

          a='''done\n\nif [[ -n $COMPARE_A || -n $COMPARE_B ]]; then'''
          b='''done\n\nif [[ -n $OUTPUT_PATH && $SAVE_REPORT -ne 1 ]]; then\n    echo "Ошибка: -o/--output используется только вместе с -s/--save" >&2\n    exit 64\nfi\n\nif [[ -n $COMPARE_A || -n $COMPARE_B ]]; then'''
          s=rep(s,a,b,'enterprise output validation',1)

          a='''# Корпоративный профиль (--corp / --profile enterprise) по умолчанию сохраняет\n# отчёт так же, как стандартный анализ. Явный -o имеет приоритет; --no-save отключает запись.\nif [[ -z $COMPARE_A && $PROFILE == enterprise && -z $OUTPUT_PATH ]] && ((SAVE_REPORT==1)); then'''
          b='''# Файл создаётся только по явному -s/--save. Без -o имя формируется автоматически.\n# Для профилей используются отдельные теги; enterprise/--corp сохраняет CORP-префикс.\nif [[ -z $COMPARE_A && -z $OUTPUT_PATH ]] && ((SAVE_REPORT==1)); then\n    CORP_TAG=${PROFILE^^}\n    [[ $PROFILE == enterprise ]] && CORP_TAG=CORP'''
          s=rep(s,a,b,'enterprise auto-name block',1)
          s=s.replace('CORP_NAME="ARM_INFO_CORP_PRIVATE_${CORP_STAMP}.${CORP_EXT}"','CORP_NAME="ARM_INFO_${CORP_TAG}_PRIVATE_${CORP_STAMP}.${CORP_EXT}"')
          s=s.replace('CORP_NAME="ARM_INFO_CORP_${CORP_HOST}_${CORP_STAMP}.${CORP_EXT}"','CORP_NAME="ARM_INFO_${CORP_TAG}_${CORP_HOST}_${CORP_STAMP}.${CORP_EXT}"')
          a='''    if [[ -d $OUTPUT_PATH ]]; then\n        # Для -o DIR используем то же имя, что и при автоматическом сохранении.\n        CORP_EXT=txt'''
          b='''    if [[ -d $OUTPUT_PATH ]]; then\n        # Для -o DIR используем то же имя, что и при автоматическом сохранении.\n        CORP_TAG=${PROFILE^^}\n        [[ $PROFILE == enterprise ]] && CORP_TAG=CORP\n        CORP_EXT=txt'''
          s=rep(s,a,b,'profile directory name block',1)
          a='''if [[ -n $OUTPUT_PATH ]] && ((SAVE_REPORT==1)); then'''
          b='''if [[ -n $COMPARE_A && -z $OUTPUT_PATH ]] && ((SAVE_REPORT==1)); then\n    CORP_EXT=txt\n    ((JSON_MODE==1)) && CORP_EXT=json\n    CORP_STAMP=$(date '+%Y%m%d_%H%M%S')\n    CORP_DIR=$(pwd -P 2>/dev/null || printf '/tmp')\n    [[ -d $CORP_DIR && -w $CORP_DIR ]] || CORP_DIR=/tmp\n    OUTPUT_PATH="$CORP_DIR/ARM_INFO_COMPARE_${CORP_STAMP}.${CORP_EXT}"\nfi\n\nif [[ -n $OUTPUT_PATH ]] && ((SAVE_REPORT==1)); then'''
          s=rep(s,a,b,'enterprise redirection block',1)

          s=s.replace('  --no-save               не сохранять отчёт в файл\n','  -s, --save             сохранить отчёт в файл\n')
          a='''done\n((SHOW_HELP==1)) && { usage; exit 0; }'''
          b='''done\n((SHOW_HELP==1)) && { usage; exit 0; }\nif [[ -n $OUTPUT_PATH && $SAVE_REPORT -ne 1 ]]; then\n    echo "Ошибка: -o/--output используется только вместе с -s/--save" >&2\n    exit 64\nfi\nif ((QUIET_MODE==1 && SAVE_REPORT==0)); then\n    echo "Ошибка: -q/--quiet используется только вместе с -s/--save" >&2\n    exit 64\nfi'''
          s=rep(s,a,b,'standard output validation',1)
          s=s.replace('if ((SAVE_REPORT==1)); then echo "Отчёт: $REPORT_FILE"; else echo "Сохранение: отключено (--no-save)"; fi','if ((SAVE_REPORT==1)); then echo "Отчёт: $REPORT_FILE"; fi')
          s=s.replace('if ((SAVE_REPORT==1)); then echo "Отчёт сохранён: $REPORT_FILE"; else echo "Отчёт не сохранялся (--no-save)."; fi','if ((SAVE_REPORT==1)); then echo "Отчёт сохранён: $REPORT_FILE"; fi')
          s=s.replace('$ARM_INFO_SELF_CMD --no-save','$ARM_INFO_SELF_CMD')
          if '--no-save' in s: raise SystemExit('arm_info.sh still contains removed option')
          p.write_text(s,encoding='utf-8')

          # Standard CLI tests.
          t=Path('tests/test_cli.sh'); ts=t.read_text(encoding='utf-8')
          ts=ts.replace('bash "$SCRIPT" --json --privacy --no-save >"$TMP"','bash "$SCRIPT" --json --privacy >"$TMP"')
          h='''bash "$SCRIPT" --help | grep -q -- '--privacy' || die "--help"\n'''
          hn='''bash "$SCRIPT" --help | grep -q -- '--privacy' || die "--help"\nbash "$SCRIPT" --help | grep -q -- '--save' || die "--save help"\nREMOVED_OPT="--no""-save"\n! bash "$SCRIPT" --help | grep -q -- "$REMOVED_OPT" || die "removed save option still in help"\n'''
          ts=rep(ts,h,hn,'cli help guards',1)
          a='''TMP=$(mktemp)\ntrap 'rm -f "$TMP"' EXIT\n'''
          b='''TMP=$(mktemp)\nSAVE_TMP=$(mktemp -d)\ntrap 'rm -f "$TMP"; rm -rf "$SAVE_TMP"' EXIT\n\nset +e\n(cd "$SAVE_TMP" && bash "$SCRIPT" --privacy >"$SAVE_TMP/stdout.txt")\nRC=$?\nset -e\n((RC>=0 && RC<=3)) || die "default run exit code $RC"\n! find "$SAVE_TMP" -maxdepth 1 -type f -name 'ARM_INFO_*' | grep -q . || die "default run created a report"\n! grep -Fq 'Отчёт:' "$SAVE_TMP/stdout.txt" || die "unsaved output shows report path"\n! grep -Fq 'Отчёт сохранён:' "$SAVE_TMP/stdout.txt" || die "unsaved output shows save status"\n\nset +e\nbash "$SCRIPT" --privacy -o "$SAVE_TMP/forbidden.txt" >/dev/null 2>&1\nRC=$?\nset -e\n[[ $RC -eq 64 ]] || die "-o without --save must exit 64, got $RC"\n[[ ! -e "$SAVE_TMP/forbidden.txt" ]] || die "-o without --save created a file"\n\nset +e\nbash "$SCRIPT" --privacy -s -o "$SAVE_TMP/short.txt" >/dev/null\nRC=$?\nset -e\n((RC>=0 && RC<=3)) || die "-s exit code $RC"\n[[ -s "$SAVE_TMP/short.txt" ]] || die "-s did not create report"\ngrep -Fq 'Отчёт:' "$SAVE_TMP/short.txt" || die "saved report missing report path"\ngrep -Fq 'Отчёт сохранён:' "$SAVE_TMP/short.txt" || die "saved report missing save status"\nset +e\nbash "$SCRIPT" --privacy --save -o "$SAVE_TMP/long.txt" >/dev/null\nRC=$?\nset -e\n((RC>=0 && RC<=3)) || die "--save exit code $RC"\n[[ -s "$SAVE_TMP/long.txt" ]] || die "--save did not create report"\n\nset +e\nbash "$SCRIPT" "$REMOVED_OPT" >/dev/null 2>&1\nRC=$?\nset -e\n[[ $RC -eq 64 ]] || die "removed save option must exit 64, got $RC"\n'''
          ts=rep(ts,a,b,'cli save tests anchor',1)
          if '--no-save' in ts: raise SystemExit('test_cli has removed option literal')
          t.write_text(ts,encoding='utf-8')

          e=Path('tests/test_enterprise.sh'); es=e.read_text(encoding='utf-8')
          es=es.replace("bash \"$SCRIPT\" --corp --help | grep -q -- '--no-save' || die \"--corp no-save help\"","bash \"$SCRIPT\" --corp --help | grep -q -- '--save' || die \"--corp save help\"")
          es=es.replace("grep -q 'SAVE_REPORT=1' \"$SCRIPT\" || die \"corporate save default\"","grep -q 'SAVE_REPORT=0' \"$SCRIPT\" || die \"save must be opt-in\"")
          es=es.replace("grep -q -- '--no-save) SAVE_REPORT=0' \"$SCRIPT\" || die \"corporate no-save switch\"","grep -q -- '-s|--save) SAVE_REPORT=1' \"$SCRIPT\" || die \"corporate save switch\"")
          a='''grep -q 'ARM_INFO_CORP_' "$SCRIPT" || die "corporate automatic report name"\n'''
          b='''grep -q 'ARM_INFO_${CORP_TAG}_' "$SCRIPT" || die "profile automatic report name"\nSAVE_DIR=$(mktemp -d)\nset +e\n(cd "$SAVE_DIR" && bash "$SCRIPT" --corp --privacy >/dev/null)\nRC=$?\nset -e\n((RC>=0 && RC<=3)) || die "corp default exit code $RC"\n! find "$SAVE_DIR" -maxdepth 1 -type f -name 'ARM_INFO_*' | grep -q . || die "corp default must not save"\nset +e\nbash "$SCRIPT" --corp --privacy --save -o "$SAVE_DIR/corp.txt" >/dev/null\nRC=$?\nset -e\n((RC>=0 && RC<=3)) || die "corp --save exit code $RC"\n[[ -s "$SAVE_DIR/corp.txt" ]] || die "corp --save did not create report"\nrm -rf "$SAVE_DIR"\n'''
          es=rep(es,a,b,'enterprise save tests anchor',1)
          if '--no-save' in es: raise SystemExit('enterprise test has removed option literal')
          e.write_text(es,encoding='utf-8')

          sec=Path('tests/test_sections.sh'); secs=sec.read_text(encoding='utf-8').replace(' --no-save','')
          if '--no-save' in secs: raise SystemExit('sections test has removed option literal')
          sec.write_text(secs,encoding='utf-8')

          r=Path('README.md'); rs=r.read_text(encoding='utf-8')
          rs=rs.replace('Корпоративный TXT-отчёт при таком запуске сохраняется автоматически в текущий каталог. Чтобы только вывести результат без сохранения, используйте `--no-save`.','По умолчанию корпоративный отчёт выводится только в терминал и файл не создаётся. Для сохранения добавьте `-s` или `--save`; при необходимости путь задаётся через `-o/--output`.')
          rs=rs.replace('sudo bash /tmp/arm_info.sh --corp --privacy --json -o /tmp/arm-corp.json','sudo bash /tmp/arm_info.sh --corp --privacy --json --save -o /tmp/arm-corp.json')
          rs=rs.replace('--no-save\n','-s, --save\n')
          rs=rs.replace('sudo arm_info --json --privacy --no-save | jq \'.summary\'','sudo arm_info --json --privacy | jq \'.summary\'')
          rs=rs.replace('sudo arm_info --output /var/tmp/arm-reports/','sudo arm_info --save --output /var/tmp/arm-reports/')
          rs=rs.replace('sudo arm_info --corp --privacy --json -o /tmp/arm-corp.json','sudo arm_info --corp --privacy --json --save -o /tmp/arm-corp.json')
          rs=rs.replace('sudo arm_info --corp --privacy --json -o arm-a.json','sudo arm_info --corp --privacy --json --save -o arm-a.json')
          rs=rs.replace('sudo arm_info --corp --privacy --json -o arm-b.json','sudo arm_info --corp --privacy --json --save -o arm-b.json')
          rs=rs.replace('Автоматическое имя privacy-отчёта не содержит hostname.','При явном сохранении автоматическое имя privacy-отчёта не содержит hostname.')
          if '--no-save' in rs: raise SystemExit('README has removed option')
          r.write_text(rs,encoding='utf-8')

          ep=Path('docs/ENTERPRISE_PROFILES.md'); eps=ep.read_text(encoding='utf-8')
          old='`--corp` и полная форма `--profile enterprise` **сохраняют отчёт по умолчанию**. Без `-o` файл создаётся в текущем доступном для записи каталоге, при необходимости используется `/tmp`. Для TXT имя имеет вид `ARM_INFO_CORP_<HOST>_<DATE>.txt`, для JSON — то же имя с расширением `.json`, а в privacy-режиме hostname из автоматического имени исключается. Ключ `--no-save` отключает сохранение. Через `-o FILE` можно задать точный путь, а через `-o DIR` — каталог для автоматически сформированного имени.'
          new='`--corp` и остальные профили **по умолчанию ничего не сохраняют**: результат выводится только в терминал. Файл создаётся только при явном `-s` / `--save`. Без `-o` имя формируется автоматически в текущем доступном для записи каталоге (при необходимости используется `/tmp`); для `--corp` сохраняется префикс `ARM_INFO_CORP_`. Через `-o FILE` можно задать точный путь, а через `-o DIR` — каталог; `-o/--output` без `-s/--save` считается ошибкой CLI.'
          eps=rep(eps,old,new,'enterprise docs save paragraph',1)
          eps=eps.replace('sudo arm_info --profile domain --privacy --json -o /tmp/domain.json','sudo arm_info --profile domain --privacy --json --save -o /tmp/domain.json')
          eps=eps.replace('sudo arm_info --corp --privacy --json -o /tmp/arm-corp.json','sudo arm_info --corp --privacy --json --save -o /tmp/arm-corp.json')
          old='''Первый вариант одновременно выводит корпоративный TXT-отчёт и автоматически сохраняет его. JSON при запуске `--corp --json` также автоматически сохраняется, если не задан `--no-save`; `-o` используется для фиксированного имени/расположения.\n\nДля запуска только на экран:\n\n```bash\nsudo arm_info --corp --no-save\n```'''
          new='''Первый вариант выводит корпоративный TXT-отчёт только в терминал. Чтобы сохранить его, используйте `sudo arm_info --corp --save`; для фиксированного имени/расположения добавьте `-o PATH`. JSON работает по тому же правилу: без `--save` файл не создаётся.'''
          eps=rep(eps,old,new,'enterprise docs behavior',1)
          eps=eps.replace('sudo arm_info --corp --privacy --json -o arm-a.json','sudo arm_info --corp --privacy --json --save -o arm-a.json').replace('sudo arm_info --corp --privacy --json -o arm-b.json','sudo arm_info --corp --privacy --json --save -o arm-b.json')
          if '--no-save' in eps: raise SystemExit('enterprise docs have removed option')
          ep.write_text(eps,encoding='utf-8')

          a=Path('docs/AUTOMATION.md'); aus=a.read_text(encoding='utf-8')
          aus=aus.replace('sudo arm_info --json --privacy --no-save','sudo arm_info --json --privacy').replace('sudo arm_info --corp --privacy --json --no-save','sudo arm_info --corp --privacy --json')
          aus=aus.replace('`--corp` по умолчанию сохраняет TXT/JSON. Для pipeline в автоматизации обычно удобнее явно добавлять `--no-save`, либо задавать файл через `-o`:','По умолчанию ни стандартный, ни корпоративный запуск файл не создаёт, поэтому JSON безопасно использовать в pipeline. Для явного сохранения добавьте `--save`; `-o` используется только вместе с `--save`:')
          aus=aus.replace('sudo arm_info --corp --privacy --json -o /var/tmp/arm-corp.json','sudo arm_info --corp --privacy --json --save -o /var/tmp/arm-corp.json')
          if '--no-save' in aus: raise SystemExit('automation docs have removed option')
          a.write_text(aus,encoding='utf-8')

          rel=Path('docs/releases/v1.2.4.md'); rels=rel.read_text(encoding='utf-8')
          bullet='- сохранение отчёта переведено в opt-in режим: по умолчанию файл не создаётся; `-s` / `--save` включает сохранение, прежний отрицательный ключ удалён, а `-o/--output` допустим только вместе с `--save`; строки о пути/сохранении выводятся только когда файл действительно создаётся;\n'
          if bullet not in rels:
              rels=rels.replace('## Release assets\n',bullet+'\n## Release assets\n',1)
          rel.write_text(rels,encoding='utf-8')
          PY
          bash -n arm_info.sh
          bash tests/test_cli.sh
          bash tests/test_enterprise.sh
          bash tests/test_sections.sh
          if git grep -n -- '--no-save' -- ':!.github/workflows/*'; then
            echo 'removed option references remain outside temporary workflows' >&2
            exit 1
          fi
      - name: Commit source changes
        shell: bash
        run: |
          git config user.name arm_info-ci
          git config user.email 157384758+NewMishka@users.noreply.github.com
          git add arm_info.sh README.md docs tests
          git commit -m "feat: make report saving explicit"
          git push origin HEAD:feature/v1.2.4-command-audit

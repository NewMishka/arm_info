name: Apply explicit save contract

on:
  push:
    branches: [feature/v1.2.4-command-audit]
    paths:
      - .github/workflows/apply-save-opt-in.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v1.2.4-command-audit
          fetch-depth: 0

      - name: Apply save contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def must_replace(text, old, new, label, count=None):
              n = text.count(old)
              if n == 0:
                  raise SystemExit(f'{label}: source text not found')
              if count is not None and n != count:
                  raise SystemExit(f'{label}: expected {count}, got {n}')
              return text.replace(old, new)

          p = Path('arm_info.sh')
          s = p.read_text(encoding='utf-8')

          s = s.replace('# Результат одновременно выводится на экран и сохраняется в TXT.', '# Результат выводится на экран; сохранение выполняется только по -s/--save.')
          s = must_replace(s, '\nSAVE_REPORT=1\n', '\nSAVE_REPORT=0\n', 'save defaults', count=2)

          s = s.replace('arm_info --profile domain [--privacy] [--json] [-o FILE]', 'arm_info --profile domain [--privacy] [--json] [-s|--save] [-o FILE]')
          s = s.replace('arm_info --profile network [--privacy] [--json] [-o FILE]', 'arm_info --profile network [--privacy] [--json] [-s|--save] [-o FILE]')
          s = s.replace('arm_info --profile print [--privacy] [--json] [-o FILE]', 'arm_info --profile print [--privacy] [--json] [-s|--save] [-o FILE]')
          s = s.replace('arm_info --profile software [--privacy] [--json] [-o FILE]', 'arm_info --profile software [--privacy] [--json] [-s|--save] [-o FILE]')
          s = s.replace('arm_info --corp [--privacy] [--json] [--no-save] [-o FILE]', 'arm_info --corp [--privacy] [--json] [-s|--save] [-o FILE]')
          s = s.replace('arm_info --profile enterprise [--privacy] [--json] [--no-save] [-o FILE]', 'arm_info --profile enterprise [--privacy] [--json] [-s|--save] [-o FILE]')
          s = s.replace('arm_info --compare REPORT_A.json REPORT_B.json [--json] [-o FILE]', 'arm_info --compare REPORT_A.json REPORT_B.json [--json] [-s|--save] [-o FILE]')

          s = must_replace(s, '        --no-save) SAVE_REPORT=0; shift ;;', '        -s|--save) SAVE_REPORT=1; shift ;;', 'enterprise save switch', count=1)
          s = must_replace(s, '        --no-save) SAVE_REPORT=0; shift ;;', '        -s|--save) SAVE_REPORT=1; shift ;;', 'standard save switch', count=1)

          ent_anchor = '''done\n\nif [[ -n $COMPARE_A || -n $COMPARE_B ]]; then'''
          ent_insert = '''done\n\nif [[ -n $OUTPUT_PATH && $SAVE_REPORT -ne 1 ]]; then\n    echo "Ошибка: -o/--output используется только вместе с -s/--save" >&2\n    exit 64\nfi\n\nif [[ -n $COMPARE_A || -n $COMPARE_B ]]; then'''
          if ent_anchor not in s:
              raise SystemExit('enterprise output validation anchor not found')
          s = s.replace(ent_anchor, ent_insert, 1)

          old_comment = '''# Корпоративный профиль (--corp / --profile enterprise) по умолчанию сохраняет\n# отчёт так же, как стандартный анализ. Явный -o имеет приоритет; --no-save отключает запись.\nif [[ -z $COMPARE_A && $PROFILE == enterprise && -z $OUTPUT_PATH ]] && ((SAVE_REPORT==1)); then'''
          new_comment = '''# Файл создаётся только по явному -s/--save. Без -o имя формируется автоматически.\n# Для профилей используются отдельные теги; enterprise/--corp сохраняет привычный CORP-префикс.\nif [[ -z $COMPARE_A && -z $OUTPUT_PATH ]] && ((SAVE_REPORT==1)); then\n    CORP_TAG=${PROFILE^^}\n    [[ $PROFILE == enterprise ]] && CORP_TAG=CORP'''
          if old_comment not in s:
              raise SystemExit('enterprise autosave block anchor not found')
          s = s.replace(old_comment, new_comment, 1)

          s = s.replace('CORP_NAME="ARM_INFO_CORP_PRIVATE_${CORP_STAMP}.${CORP_EXT}"', 'CORP_NAME="ARM_INFO_${CORP_TAG}_PRIVATE_${CORP_STAMP}.${CORP_EXT}"')
          s = s.replace('CORP_NAME="ARM_INFO_CORP_${CORP_HOST}_${CORP_STAMP}.${CORP_EXT}"', 'CORP_NAME="ARM_INFO_${CORP_TAG}_${CORP_HOST}_${CORP_STAMP}.${CORP_EXT}"')

          dir_anchor = '''    if [[ -d $OUTPUT_PATH ]]; then\n        # Для -o DIR используем то же имя, что и при автоматическом сохранении.\n        CORP_EXT=txt'''
          dir_new = '''    if [[ -d $OUTPUT_PATH ]]; then\n        # Для -o DIR используем то же имя, что и при автоматическом сохранении.\n        CORP_TAG=${PROFILE^^}\n        [[ $PROFILE == enterprise ]] && CORP_TAG=CORP\n        CORP_EXT=txt'''
          if dir_anchor not in s:
              raise SystemExit('enterprise output dir anchor not found')
          s = s.replace(dir_anchor, dir_new, 1)

          # Compare can also be explicitly saved; when no path is supplied, create a local name.
          compare_anchor = '''if [[ -n $OUTPUT_PATH ]] && ((SAVE_REPORT==1)); then'''
          compare_prefix = '''if [[ -n $COMPARE_A && -z $OUTPUT_PATH ]] && ((SAVE_REPORT==1)); then\n    CORP_EXT=txt\n    ((JSON_MODE==1)) && CORP_EXT=json\n    CORP_STAMP=$(date '+%Y%m%d_%H%M%S')\n    OUTPUT_PATH="$(pwd -P 2>/dev/null || printf '/tmp')/ARM_INFO_COMPARE_${CORP_STAMP}.${CORP_EXT}"\nfi\n\nif [[ -n $OUTPUT_PATH ]] && ((SAVE_REPORT==1)); then'''
          if compare_anchor not in s:
              raise SystemExit('enterprise save redirection anchor not found')
          s = s.replace(compare_anchor, compare_prefix, 1)

          s = s.replace('  --no-save               не сохранять отчёт в файл\n', '  -s, --save             сохранить отчёт в файл\n')
          std_anchor = '''done\n((SHOW_HELP==1)) && { usage; exit 0; }'''
          std_insert = '''done\n((SHOW_HELP==1)) && { usage; exit 0; }\nif [[ -n $OUTPUT_PATH && $SAVE_REPORT -ne 1 ]]; then\n    echo "Ошибка: -o/--output используется только вместе с -s/--save" >&2\n    exit 64\nfi\nif ((QUIET_MODE==1 && SAVE_REPORT==0)); then\n    echo "Ошибка: -q/--quiet используется только вместе с -s/--save" >&2\n    exit 64\nfi'''
          if std_anchor not in s:
              raise SystemExit('standard validation anchor not found')
          s = s.replace(std_anchor, std_insert, 1)

          s = s.replace('if ((SAVE_REPORT==1)); then echo "Отчёт: $REPORT_FILE"; else echo "Сохранение: отключено (--no-save)"; fi', 'if ((SAVE_REPORT==1)); then echo "Отчёт: $REPORT_FILE"; fi')
          s = s.replace('if ((SAVE_REPORT==1)); then echo "Отчёт сохранён: $REPORT_FILE"; else echo "Отчёт не сохранялся (--no-save)."; fi', 'if ((SAVE_REPORT==1)); then echo "Отчёт сохранён: $REPORT_FILE"; fi')
          s = s.replace('$ARM_INFO_SELF_CMD --no-save', '$ARM_INFO_SELF_CMD')

          if '--no-save' in s:
              raise SystemExit('arm_info.sh still contains --no-save')
          p.write_text(s, encoding='utf-8')

          # CLI regression tests.
          t = Path('tests/test_cli.sh')
          ts = t.read_text(encoding='utf-8').replace('bash "$SCRIPT" --json --privacy --no-save >"$TMP"', 'bash "$SCRIPT" --json --privacy >"$TMP"')
          help_anchor = '''bash "$SCRIPT" --help | grep -q -- '--privacy' || die "--help"\n'''
          help_guards = '''bash "$SCRIPT" --help | grep -q -- '--privacy' || die "--help"\nbash "$SCRIPT" --help | grep -q -- '--save' || die "--save help"\n! bash "$SCRIPT" --help | grep -q -- '--no-save' || die "obsolete --no-save in help"\n'''
          if help_anchor not in ts:
              raise SystemExit('test_cli help anchor missing')
          ts = ts.replace(help_anchor, help_guards, 1)
          before_tmp = '''TMP=$(mktemp)\ntrap 'rm -f "$TMP"' EXIT\n'''
          save_tests = '''TMP=$(mktemp)\nSAVE_TMP=$(mktemp -d)\ntrap 'rm -f "$TMP"; rm -rf "$SAVE_TMP"' EXIT\n\n# Saving is opt-in: default run creates no report file.\nset +e\n(cd "$SAVE_TMP" && bash "$SCRIPT" --privacy >/dev/null)\nRC=$?\nset -e\n((RC>=0 && RC<=3)) || die "default no-save exit code $RC"\n! find "$SAVE_TMP" -maxdepth 1 -type f -name 'ARM_INFO_*' | grep -q . || die "default run created a report"\n\n# -o without -s/--save is rejected so saving always remains explicit.\nset +e\nbash "$SCRIPT" --privacy -o "$SAVE_TMP/forbidden.txt" >/dev/null 2>&1\nRC=$?\nset -e\n[[ $RC -eq 64 ]] || die "-o without --save must exit 64, got $RC"\n[[ ! -e "$SAVE_TMP/forbidden.txt" ]] || die "-o without --save created a file"\n\n# Both short and long save switches create reports.\nset +e\nbash "$SCRIPT" --privacy -s -o "$SAVE_TMP/short.txt" >/dev/null\nRC=$?\nset -e\n((RC>=0 && RC<=3)) || die "-s exit code $RC"\n[[ -s "$SAVE_TMP/short.txt" ]] || die "-s did not create report"\ngrep -Fq 'Отчёт:' "$SAVE_TMP/short.txt" || die "saved report missing report path row"\ngrep -Fq 'Отчёт сохранён:' "$SAVE_TMP/short.txt" || die "saved report missing saved row"\nset +e\nbash "$SCRIPT" --privacy --save -o "$SAVE_TMP/long.txt" >/dev/null\nRC=$?\nset -e\n((RC>=0 && RC<=3)) || die "--save exit code $RC"\n[[ -s "$SAVE_TMP/long.txt" ]] || die "--save did not create report"\n\n# Removed switch must be an unknown CLI option.\nset +e\nbash "$SCRIPT" --no-save >/dev/null 2>&1\nRC=$?\nset -e\n[[ $RC -eq 64 ]] || die "removed --no-save must exit 64, got $RC"\n'''
          if before_tmp not in ts:
              raise SystemExit('test_cli tmp anchor missing')
          ts = ts.replace(before_tmp, save_tests, 1)
          t.write_text(ts, encoding='utf-8')

          e = Path('tests/test_enterprise.sh')
          es = e.read_text(encoding='utf-8')
          es = es.replace('bash "$SCRIPT" --corp --help | grep -q -- \'--no-save\' || die "--corp no-save help"', 'bash "$SCRIPT" --corp --help | grep -q -- \'--save\' || die "--corp save help"')
          es = es.replace("grep -q 'SAVE_REPORT=1' \"$SCRIPT\" || die \"corporate save default\"", "grep -q 'SAVE_REPORT=0' \"$SCRIPT\" || die \"save must be opt-in\"")
          es = es.replace("grep -q -- '--no-save) SAVE_REPORT=0' \"$SCRIPT\" || die \"corporate no-save switch\"", "grep -q -- '-s|--save) SAVE_REPORT=1' \"$SCRIPT\" || die \"corporate save switch\"")
          save_contract_anchor = '''grep -q 'ARM_INFO_CORP_' "$SCRIPT" || die "corporate automatic report name"\n'''
          save_contract = '''grep -q 'ARM_INFO_${CORP_TAG}_' "$SCRIPT" || die "profile automatic report name"\n\nSAVE_DIR=$(mktemp -d)\nset +e\n(cd "$SAVE_DIR" && bash "$SCRIPT" --corp --privacy >/dev/null)\nRC=$?\nset -e\n((RC>=0 && RC<=3)) || die "corp default exit code $RC"\n! find "$SAVE_DIR" -maxdepth 1 -type f -name 'ARM_INFO_*' | grep -q . || die "corp default must not save"\nset +e\nbash "$SCRIPT" --corp --privacy --save -o "$SAVE_DIR/corp.txt" >/dev/null\nRC=$?\nset -e\n((RC>=0 && RC<=3)) || die "corp --save exit code $RC"\n[[ -s "$SAVE_DIR/corp.txt" ]] || die "corp --save did not create report"\nrm -rf "$SAVE_DIR"\n'''
          if save_contract_anchor not in es:
              raise SystemExit('enterprise save test anchor missing')
          es = es.replace(save_contract_anchor, save_contract, 1)
          if '--no-save' in es:
              raise SystemExit('test_enterprise still contains --no-save')
          e.write_text(es, encoding='utf-8')

          sec = Path('tests/test_sections.sh')
          secs = sec.read_text(encoding='utf-8').replace(' --no-save', '')
          if '--no-save' in secs:
              raise SystemExit('test_sections still contains --no-save')
          sec.write_text(secs, encoding='utf-8')

          # README: default is screen-only; saving requires -s/--save.
          r = Path('README.md')
          rs = r.read_text(encoding='utf-8')
          rs = rs.replace('Корпоративный TXT-отчёт при таком запуске сохраняется автоматически в текущий каталог. Чтобы только вывести результат без сохранения, используйте `--no-save`.', 'По умолчанию корпоративный отчёт выводится только в терминал и файл не создаётся. Для сохранения добавьте `-s` или `--save`; при необходимости путь задаётся через `-o/--output`.')
          rs = rs.replace('sudo bash /tmp/arm_info.sh --corp --privacy --json -o /tmp/arm-corp.json', 'sudo bash /tmp/arm_info.sh --corp --privacy --json --save -o /tmp/arm-corp.json')
          rs = rs.replace('--no-save\n', '-s, --save\n')
          rs = rs.replace('sudo arm_info --json --privacy --no-save | jq \'.summary\'', 'sudo arm_info --json --privacy | jq \'.summary\'')
          rs = rs.replace('sudo arm_info --output /var/tmp/arm-reports/', 'sudo arm_info --save --output /var/tmp/arm-reports/')
          rs = rs.replace('sudo arm_info --corp --privacy --json -o /tmp/arm-corp.json', 'sudo arm_info --corp --privacy --json --save -o /tmp/arm-corp.json')
          rs = rs.replace('sudo arm_info --corp --privacy --json -o arm-a.json', 'sudo arm_info --corp --privacy --json --save -o arm-a.json')
          rs = rs.replace('sudo arm_info --corp --privacy --json -o arm-b.json', 'sudo arm_info --corp --privacy --json --save -o arm-b.json')
          rs = rs.replace('Автоматическое имя privacy-отчёта не содержит hostname.', 'При явном сохранении автоматическое имя privacy-отчёта не содержит hostname.')
          if '--no-save' in rs:
              raise SystemExit('README still contains --no-save')
          r.write_text(rs, encoding='utf-8')

          ep = Path('docs/ENTERPRISE_PROFILES.md')
          eps = ep.read_text(encoding='utf-8')
          old = '`--corp` и полная форма `--profile enterprise` **сохраняют отчёт по умолчанию**. Без `-o` файл создаётся в текущем доступном для записи каталоге, при необходимости используется `/tmp`. Для TXT имя имеет вид `ARM_INFO_CORP_<HOST>_<DATE>.txt`, для JSON — то же имя с расширением `.json`, а в privacy-режиме hostname из автоматического имени исключается. Ключ `--no-save` отключает сохранение. Через `-o FILE` можно задать точный путь, а через `-o DIR` — каталог для автоматически сформированного имени.'
          new = '`--corp` и остальные профили **по умолчанию ничего не сохраняют**: результат выводится только в терминал. Файл создаётся только при явном `-s` / `--save`. Без `-o` имя формируется автоматически в текущем доступном для записи каталоге (при необходимости используется `/tmp`); для `--corp` сохраняется префикс `ARM_INFO_CORP_`. Через `-o FILE` можно задать точный путь, а через `-o DIR` — каталог; `-o/--output` без `-s/--save` считается ошибкой CLI.'
          if old not in eps:
              raise SystemExit('enterprise docs save paragraph not found')
          eps = eps.replace(old, new)
          eps = eps.replace('sudo arm_info --profile domain --privacy --json -o /tmp/domain.json', 'sudo arm_info --profile domain --privacy --json --save -o /tmp/domain.json')
          eps = eps.replace('sudo arm_info --corp --privacy --json -o /tmp/arm-corp.json', 'sudo arm_info --corp --privacy --json --save -o /tmp/arm-corp.json')
          old_block = '''Первый вариант одновременно выводит корпоративный TXT-отчёт и автоматически сохраняет его. JSON при запуске `--corp --json` также автоматически сохраняется, если не задан `--no-save`; `-o` используется для фиксированного имени/расположения.\n\nДля запуска только на экран:\n\n```bash\nsudo arm_info --corp --no-save\n```'''
          new_block = '''Первый вариант выводит корпоративный TXT-отчёт только в терминал. Чтобы сохранить его, используйте `sudo arm_info --corp --save`; для фиксированного имени/расположения добавьте `-o PATH`. JSON работает по тому же правилу: без `--save` файл не создаётся.'''
          if old_block not in eps:
              raise SystemExit('enterprise docs behavior block not found')
          eps = eps.replace(old_block, new_block)
          eps = eps.replace('sudo arm_info --corp --privacy --json -o arm-a.json', 'sudo arm_info --corp --privacy --json --save -o arm-a.json')
          eps = eps.replace('sudo arm_info --corp --privacy --json -o arm-b.json', 'sudo arm_info --corp --privacy --json --save -o arm-b.json')
          if '--no-save' in eps:
              raise SystemExit('enterprise docs still contain --no-save')
          ep.write_text(eps, encoding='utf-8')

          a = Path('docs/AUTOMATION.md')
          aus = a.read_text(encoding='utf-8')
          aus = aus.replace('sudo arm_info --json --privacy --no-save', 'sudo arm_info --json --privacy')
          aus = aus.replace('sudo arm_info --corp --privacy --json --no-save', 'sudo arm_info --corp --privacy --json')
          aus = aus.replace('`--corp` по умолчанию сохраняет TXT/JSON. Для pipeline в автоматизации обычно удобнее явно добавлять `--no-save`, либо задавать файл через `-o`:', 'По умолчанию ни стандартный, ни корпоративный запуск файл не создаёт, поэтому JSON безопасно использовать в pipeline. Для явного сохранения добавьте `--save`; `-o` используется только вместе с `--save`:')
          aus = aus.replace('sudo arm_info --corp --privacy --json -o /var/tmp/arm-corp.json', 'sudo arm_info --corp --privacy --json --save -o /var/tmp/arm-corp.json')
          if '--no-save' in aus:
              raise SystemExit('automation docs still contain --no-save')
          a.write_text(aus, encoding='utf-8')

          rel = Path('docs/releases/v1.2.4.md')
          rels = rel.read_text(encoding='utf-8')
          marker = '## Release assets\n'
          bullet = '- сохранение отчёта переведено в opt-in режим: по умолчанию файл не создаётся; `-s` / `--save` включает сохранение, `--no-save` удалён, а `-o/--output` допустим только вместе с `--save`; строки о пути/сохранении выводятся только когда файл действительно создаётся;\n'
          if bullet not in rels:
              if marker not in rels:
                  raise SystemExit('release marker missing')
              rels = rels.replace(marker, bullet + '\n' + marker, 1)
          rel.write_text(rels, encoding='utf-8')
          PY

          bash -n arm_info.sh
          bash tests/test_cli.sh
          bash tests/test_enterprise.sh
          bash tests/test_sections.sh
          if git grep -n -- '--no-save'; then
            echo 'obsolete --no-save references remain' >&2
            exit 1
          fi

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name arm_info-ci
          git config user.email 157384758+NewMishka@users.noreply.github.com
          git rm .github/workflows/apply-save-opt-in.yml
          git add arm_info.sh README.md docs tests
          git commit -m "feat: make report saving explicit"
          git push origin HEAD:feature/v1.2.4-command-audit

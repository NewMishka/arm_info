name: Finalize v1.2.1 docs

on:
  push:
    branches: [feature/single-file-v1.2.1]
    paths:
      - .github/workflows/finalize-single-file-docs-v121.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update remaining single-file references
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('Makefile'); s=p.read_text(encoding='utf-8')
          s=s.replace('arm_info.sh arm_info-enterprise.sh install.sh','arm_info.sh install.sh')
          p.write_text(s,encoding='utf-8')

          p=Path('README.md'); s=p.read_text(encoding='utf-8')
          s=s.replace('Скрипт сохраняет совместимость с прежним сценарием: его содержимое можно целиком вставить в Bash после `su -`. Enterprise-профили требуют установленного рядом helper `arm_info-enterprise.sh`, поэтому для них рекомендуется запуск из клонированного репозитория или после `install.sh`.','Начиная с версии **1.2.1** вся базовая и корпоративная диагностика находится в одном `arm_info.sh`. Для переноса на проверяемый АРМ достаточно одного файла: `sudo bash arm_info.sh --profile enterprise`. Установка через `install.sh` остаётся доступной, но отдельный enterprise-helper больше не требуется.')
          s=s.replace('`arm_info 1.2.0` добавляет отдельные профили','`arm_info 1.2.1` содержит встроенные профили')
          s=s.replace('Текущая версия: **1.2.0**.','Текущая версия: **1.2.1**.')
          s=s.replace('- enterprise-профили: AD/SSSD/Kerberos/DNS, 802.1X, CIFS/GVFS и CUPS;','- enterprise-профили в том же единственном файле: AD/SSSD/Kerberos/DNS, 802.1X, CIFS/GVFS и CUPS;')
          p.write_text(s,encoding='utf-8')

          p=Path('docs/ENTERPRISE_PROFILES.md'); s=p.read_text(encoding='utf-8')
          anchor='Они не входят в аппаратный health score и предназначены для оперативной диагностики инфраструктурных проблем.\n'
          note='\n> **С версии 1.2.1 все профили встроены в `arm_info.sh`. На проверяемый АРМ достаточно перенести один файл; `arm_info-enterprise.sh` больше не требуется.**\n'
          if note.strip() not in s: s=s.replace(anchor,anchor+note,1)
          p.write_text(s,encoding='utf-8')

          p=Path('CHANGELOG.md'); s=p.read_text(encoding='utf-8')
          block='## 1.2.1 — 2026-09-15\n\n### Changed\n- `arm_info.sh` стал полностью автономным: base + `domain/network/print/software/enterprise` + `--compare` находятся в одном файле.\n- Для запуска enterprise-профилей больше не требуется `arm_info-enterprise.sh` или каталог `libexec`.\n- Installer, RPM, CI, tests и GitHub Release переведены на однофайловую поставку.\n- Сценарий работы по SSH упрощён: на проверяемый АРМ достаточно передать один `arm_info.sh`.\n\n'
          if '## 1.2.1 — 2026-09-15' not in s: s=s.replace('# Changelog\n\n','# Changelog\n\n'+block,1)
          s=s.replace('- Инвентаризация корпоративного ПО: R7, Citrix/ICAClient, Remmina/FreeRDP, браузеры, Basis Workplace, Crypto/Token middleware и SNX.','- Глобальная инвентаризация всех установленных RPM-пакетов без списка заранее заданного ПО.')
          p.write_text(s,encoding='utf-8')

          Path('docs/releases/v1.2.1.md').write_text('# arm_info 1.2.1\n\nОднофайловая поставка для удалённой диагностики АРМ.\n\n- `arm_info.sh` содержит базовую и enterprise-диагностику;\n- встроены профили `domain`, `network`, `print`, `software`, `enterprise`;\n- встроен `--compare`;\n- внешний `arm_info-enterprise.sh` и `libexec` больше не требуются;\n- installer/RPM/CI переведены на один исполняемый файл.\n\nТиповой запуск по SSH:\n\n```bash\nscp arm_info.sh admin@HOST:/tmp/\nssh admin@HOST\nsudo bash /tmp/arm_info.sh --profile enterprise\n```\n',encoding='utf-8')
          PY
      - name: Validate
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y shellcheck >/dev/null
          make check
          bash tests/test_cli.sh
          bash tests/test_enterprise.sh
          test ! -e arm_info-enterprise.sh
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Makefile README.md docs CHANGELOG.md
          git commit -m "docs: finalize single-file arm_info 1.2.1"
          git push

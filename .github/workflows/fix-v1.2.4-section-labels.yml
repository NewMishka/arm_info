name: Fix v1.2.4 section labels

on:
  push:
    branches: [feature/v1.2.4-command-audit]
    paths:
      - '.github/scripts/fix_v1_2_4_section_labels.py'
      - '.github/workflows/fix-v1.2.4-section-labels.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v1.2.4-command-audit
      - name: Fix report label
        run: python3 .github/scripts/fix_v1_2_4_section_labels.py
      - name: Validate section coverage
        run: |
          bash -n arm_info.sh tests/test_sections.sh
          bash tests/test_sections.sh
      - name: Commit
        run: |
          git config user.name NewMishka
          git config user.email '157384758+NewMishka@users.noreply.github.com'
          git add arm_info.sh
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'fix: align stability label across report sections'
          git push origin HEAD:feature/v1.2.4-command-audit

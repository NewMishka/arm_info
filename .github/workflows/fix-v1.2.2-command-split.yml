name: Fix v1.2.2 corporate command splitting

on:
  push:
    branches:
      - feature/v1.2.2-corp-report
    paths:
      - '.github/scripts/fix_v1_2_2_command_split.py'
      - '.github/workflows/fix-v1.2.2-command-split.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v1.2.2-corp-report
      - name: Apply fix
        run: python3 .github/scripts/fix_v1_2_2_command_split.py
      - name: Validate
        run: |
          bash -n arm_info.sh
          shellcheck --severity=error arm_info.sh
          bash tests/test_cli.sh
          bash tests/test_enterprise.sh
          grep -q 'split_rec_commands' arm_info.sh
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add arm_info.sh
          git diff --cached --quiet && exit 0
          git commit -m 'fix: preserve pipelines in corporate recommendations'
          git push

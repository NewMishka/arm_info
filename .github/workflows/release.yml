name: Release

on:
  push:
    branches: [main]
    paths:
      - VERSION
      - arm_info.sh
      - docs/releases/**
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release version
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          test -n "$VERSION"
          test "$VERSION" = "$(sed -n 's/^ARM_INFO_VERSION="\([^"]*\)"/\1/p' arm_info.sh | head -1)"
          test "$VERSION" = "$(awk '/^Version:/{print $2; exit}' packaging/arm_info.spec)"
          test -f "docs/releases/v${VERSION}.md"

      - name: Build release assets
        run: |
          chmod 0755 arm_info.sh
          sha256sum arm_info.sh > SHA256SUMS

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          TAG="v${VERSION}"
          NOTES="docs/releases/${TAG}.md"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            TAG_SHA=$(git rev-list -n1 "$TAG")
            if [[ "$TAG_SHA" != "$GITHUB_SHA" ]]; then
              echo "Tag $TAG already points to $TAG_SHA, current commit is $GITHUB_SHA" >&2
              exit 1
            fi
          else
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "$TAG"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "arm_info ${VERSION}" --notes-file "$NOTES"
            gh release upload "$TAG" arm_info.sh SHA256SUMS --clobber
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "arm_info ${VERSION}" \
              --notes-file "$NOTES" \
              arm_info.sh SHA256SUMS
          fi

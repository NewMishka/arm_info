name: Patch v1.2.4 CIFS docs

on:
  push:
    branches:
      - feature/v1.2.4-command-audit
    paths:
      - '.github/workflows/patch-v1.2.4-cifs-docs.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v1.2.4-command-audit
          fetch-depth: 0
      - name: Apply CIFS docs patch
        run: python3 .github/scripts/patch_v1_2_4_cifs_docs.py
      - name: Commit generated docs
        run: |
          if git diff --quiet -- docs/COMMANDS.md CHANGELOG.md; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/COMMANDS.md CHANGELOG.md
          git commit -m 'docs: clarify CIFS TARGET validation'
          git push origin HEAD:feature/v1.2.4-command-audit

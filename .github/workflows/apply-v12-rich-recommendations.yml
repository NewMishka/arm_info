name: Apply v1.2 rich recommendations

on:
  push:
    branches:
      - feature/enterprise-profiles-v1.2.0
    paths:
      - tools/patch-v12-rich-recommendations.py
      - .github/workflows/apply-v12-rich-recommendations.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 tools/patch-v12-rich-recommendations.py
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Syntax
        run: bash -n arm_info.sh arm_info-enterprise.sh install.sh tests/test_cli.sh tests/test_enterprise.sh packaging/build-rpm.sh
      - name: ShellCheck errors
        run: shellcheck --severity=error arm_info.sh arm_info-enterprise.sh install.sh tests/test_cli.sh tests/test_enterprise.sh packaging/build-rpm.sh
      - name: Tests
        run: |
          bash tests/test_cli.sh
          bash tests/test_enterprise.sh
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add arm_info-enterprise.sh tests/test_enterprise.sh README.md docs/ENTERPRISE_PROFILES.md CHANGELOG.md .github/workflows/ci.yml
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "feat: add detailed enterprise recommendations and release checks"
          git push

# Temporary workflow used only to apply the prepared patch on the feature branch.

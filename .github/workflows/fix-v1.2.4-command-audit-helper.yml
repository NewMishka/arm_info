name: Fix v1.2.4 audit helper

on:
  push:
    branches: [feature/v1.2.4-command-audit]
    paths:
      - .github/workflows/fix-v1.2.4-command-audit-helper.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v1.2.4-command-audit
      - name: Fix helper
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/apply_v1_2_4_command_audit.py')
          s = p.read_text(encoding='utf-8')
          old = '''! grep -Fq "find /tmp -maxdepth 1 -type f -name 'krb5cc_*'" "$SCRIPT" || fail 'FILE-cache-only Kerberos recommendation remains' '''.rstrip()
          new = '''! grep -Fq 'REC_COMMAND="klist -A|find /tmp -maxdepth 1 -type f -name' "$SCRIPT" || fail 'FILE-cache-only Kerberos recommendation remains' '''.rstrip()
          if old not in s:
              raise SystemExit('Kerberos regression test line not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name NewMishka
          git config user.email '157384758+NewMishka@users.noreply.github.com'
          git add .github/scripts/apply_v1_2_4_command_audit.py
          git commit -m 'fix: scope Kerberos recommendation regression test'
          git push origin HEAD:feature/v1.2.4-command-audit

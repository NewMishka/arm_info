name: Fix v1.2.4 audit helper

on:
  push:
    branches: [feature/v1.2.4-command-audit]
    paths:
      - .github/workflows/fix-v1.2.4-command-audit-helper.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v1.2.4-command-audit
      - name: Fix helper
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/apply_v1_2_4_command_audit.py')
          s = p.read_text(encoding='utf-8')
          old = '        sudo\\ -u* klist*) desc="покажет Kerberos-билеты в контексте указанного пользователя; это важно, если arm_info запущен от root" ;;'
          new = '        sudo\\ -u*\\ klist*) desc="покажет Kerberos-билеты в контексте указанного пользователя; это важно, если arm_info запущен от root" ;;'
          if old not in s:
              raise SystemExit('sudo klist case pattern not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name NewMishka
          git config user.email '157384758+NewMishka@users.noreply.github.com'
          git add .github/scripts/apply_v1_2_4_command_audit.py
          git commit -m 'fix: escape sudo klist case pattern'
          git push origin HEAD:feature/v1.2.4-command-audit

name: Apply DC and GVFS diagnostics

on:
  push:
    branches: [feature/v1.2.5-dc-gvfs]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v1.2.5-dc-gvfs
          fetch-depth: 0
      - name: Apply patch
        run: python3 tools/patch_dc_gvfs.py
      - name: Run focused tests
        run: |
          bash -n arm_info.sh tests/test_enterprise.sh
          bash tests/test_enterprise.sh
          bash tests/test_cifs_probe.sh
          bash tests/test_sections.sh
          bash tests/test_recommendation_commands.sh
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add arm_info.sh tests/test_enterprise.sh docs/ENTERPRISE_PROFILES.md CHANGELOG.md
          git diff --cached --check
          git commit -m 'feat: detail domain controllers and harden GVFS checks'
          git push origin HEAD:feature/v1.2.5-dc-gvfs

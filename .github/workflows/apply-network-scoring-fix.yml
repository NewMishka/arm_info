name: Apply network scoring fix

on:
  push:
    branches:
      - feature/v1.2.4-command-audit
    paths:
      - .github/workflows/apply-network-scoring-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply RX drop scoring fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected 1 match, found {count}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          p = Path('arm_info.sh')
          s = p.read_text(encoding='utf-8')

          old = '''RX_ERRORS_TOTAL=0; TX_ERRORS_TOTAL=0
          RX_DROPS_TOTAL=0; TX_DROPS_TOTAL=0
          RX_PACKETS_TOTAL=0; TX_PACKETS_TOTAL=0
          RXTX_ERRORS=0; RXTX_DROPS=0; RXTX_PACKETS=0
          NET_ROWS=(); NET_BAD_IFACES=()'''
          new = '''RX_ERRORS_TOTAL=0; TX_ERRORS_TOTAL=0
          # rx_dropped сохраняем как диагностический счётчик, но сам по себе он не
          # доказывает потерю полезного трафика: ядро может учитывать там L2/filter drops.
          RX_DROPS_TOTAL=0; RX_MISSED_TOTAL=0; TX_DROPS_TOTAL=0
          RX_PACKETS_TOTAL=0; TX_PACKETS_TOTAL=0
          RXTX_ERRORS=0; SCORED_LOSSES_TOTAL=0; RXTX_PACKETS=0
          NET_ROWS=(); NET_BAD_IFACES=()'''
          if s.count(old) != 1:
              raise SystemExit('arm_info.sh: network totals block mismatch')
          s = s.replace(old, new, 1)

          old = '''    RX=$(cat "$P/statistics/rx_errors" 2>/dev/null); TX=$(cat "$P/statistics/tx_errors" 2>/dev/null); RXD=$(cat "$P/statistics/rx_dropped" 2>/dev/null); TXD=$(cat "$P/statistics/tx_dropped" 2>/dev/null)
              RXP=$(cat "$P/statistics/rx_packets" 2>/dev/null); TXP=$(cat "$P/statistics/tx_packets" 2>/dev/null)
              for V in RX TX RXD TXD RXP TXP; do eval 'X=${'"$V"'}'; [[ "$X" =~ ^[0-9]+$ ]]||eval "$V=0"; done
              RX_ERRORS_TOTAL=$((RX_ERRORS_TOTAL+RX)); TX_ERRORS_TOTAL=$((TX_ERRORS_TOTAL+TX))
              RX_DROPS_TOTAL=$((RX_DROPS_TOTAL+RXD)); TX_DROPS_TOTAL=$((TX_DROPS_TOTAL+TXD))
              RX_PACKETS_TOTAL=$((RX_PACKETS_TOTAL+RXP)); TX_PACKETS_TOTAL=$((TX_PACKETS_TOTAL+TXP))
              RXTX_ERRORS=$((RX_ERRORS_TOTAL+TX_ERRORS_TOTAL)); RXTX_DROPS=$((RX_DROPS_TOTAL+TX_DROPS_TOTAL)); RXTX_PACKETS=$((RX_PACKETS_TOTAL+TX_PACKETS_TOTAL))
              IF_BAD=$((RX+TX+RXD+TXD)); IF_PKT=$((RXP+TXP)); IF_PPM=0; ((IF_PKT>0))&&IF_PPM=$((IF_BAD*1000000/IF_PKT)); ((IF_PPM>=1000))&&NET_BAD_IFACES+=("$IFACE:${IF_PPM}ppm")'''
          new = '''    RX=$(cat "$P/statistics/rx_errors" 2>/dev/null); TX=$(cat "$P/statistics/tx_errors" 2>/dev/null); RXD=$(cat "$P/statistics/rx_dropped" 2>/dev/null); RXM=$(cat "$P/statistics/rx_missed_errors" 2>/dev/null); TXD=$(cat "$P/statistics/tx_dropped" 2>/dev/null)
              RXP=$(cat "$P/statistics/rx_packets" 2>/dev/null); TXP=$(cat "$P/statistics/tx_packets" 2>/dev/null)
              for V in RX TX RXD RXM TXD RXP TXP; do eval 'X=${'"$V"'}'; [[ "$X" =~ ^[0-9]+$ ]]||eval "$V=0"; done
              RX_ERRORS_TOTAL=$((RX_ERRORS_TOTAL+RX)); TX_ERRORS_TOTAL=$((TX_ERRORS_TOTAL+TX))
              RX_DROPS_TOTAL=$((RX_DROPS_TOTAL+RXD)); RX_MISSED_TOTAL=$((RX_MISSED_TOTAL+RXM)); TX_DROPS_TOTAL=$((TX_DROPS_TOTAL+TXD))
              RX_PACKETS_TOTAL=$((RX_PACKETS_TOTAL+RXP)); TX_PACKETS_TOTAL=$((TX_PACKETS_TOTAL+TXP))
              RXTX_ERRORS=$((RX_ERRORS_TOTAL+TX_ERRORS_TOTAL)); SCORED_LOSSES_TOTAL=$((RX_MISSED_TOTAL+TX_DROPS_TOTAL)); RXTX_PACKETS=$((RX_PACKETS_TOTAL+TX_PACKETS_TOTAL))
              # В score входят errors + реальные пропуски host/NIC + TX drops. Общий
              # rx_dropped остаётся информационным и не создаёт WARN самостоятельно.
              IF_BAD=$((RX+TX+RXM+TXD)); IF_PKT=$((RXP+TXP)); IF_PPM=0; ((IF_PKT>0))&&IF_PPM=$((IF_BAD*1000000/IF_PKT)); ((IF_PPM>=1000))&&NET_BAD_IFACES+=("$IFACE:${IF_PPM}ppm")'''
          if s.count(old) != 1:
              raise SystemExit('arm_info.sh: network per-interface block mismatch')
          s = s.replace(old, new, 1)

          old = '''NET_BAD_PPM=0
          NET_ERROR_PPM=0
          NET_DROP_PPM=0
          NET_BAD_PERCENT="0.0000"
          if ((RXTX_PACKETS>0)); then
              NET_BAD_PPM=$(((RXTX_ERRORS+RXTX_DROPS)*1000000/RXTX_PACKETS))
              NET_ERROR_PPM=$((RXTX_ERRORS*1000000/RXTX_PACKETS))
              NET_DROP_PPM=$((RXTX_DROPS*1000000/RXTX_PACKETS))
              NET_BAD_PERCENT=$(awk -v bad="$((RXTX_ERRORS+RXTX_DROPS))" -v pkt="$RXTX_PACKETS" 'BEGIN{if(pkt>0)printf "%.4f",bad*100/pkt;else print "0.0000"}')
          fi'''
          new = '''NET_BAD_PPM=0
          NET_ERROR_PPM=0
          NET_DROP_PPM=0
          NET_RX_DROP_PPM_RAW=0
          NET_SCORED_LOSS_PPM=0
          NET_BAD_PERCENT="0.0000"
          if ((RXTX_PACKETS>0)); then
              NET_BAD_PPM=$(((RXTX_ERRORS+SCORED_LOSSES_TOTAL)*1000000/RXTX_PACKETS))
              NET_ERROR_PPM=$((RXTX_ERRORS*1000000/RXTX_PACKETS))
              NET_SCORED_LOSS_PPM=$((SCORED_LOSSES_TOTAL*1000000/RXTX_PACKETS))
              # drop_ppm сохраняется для совместимости schema v1, но начиная с 1.2.4
              # означает только учитываемые потери (rx_missed + tx_dropped).
              NET_DROP_PPM=$NET_SCORED_LOSS_PPM
              NET_BAD_PERCENT=$(awk -v bad="$((RXTX_ERRORS+SCORED_LOSSES_TOTAL))" -v pkt="$RXTX_PACKETS" 'BEGIN{if(pkt>0)printf "%.4f",bad*100/pkt;else print "0.0000"}')
          fi
          if ((RX_PACKETS_TOTAL>0)); then
              NET_RX_DROP_PPM_RAW=$((RX_DROPS_TOTAL*1000000/RX_PACKETS_TOTAL))
          fi'''
          if s.count(old) != 1:
              raise SystemExit('arm_info.sh: network ppm block mismatch')
          s = s.replace(old, new, 1)

          old = '''        *сетевых\\ ошибок/дропов*)
                      cause="Рост RX/TX errors/dropped возможен из-за физического линка, порта коммутатора, перегрузки, драйвера, очередей NIC или несогласованных параметров."
                      diagnostic="Снять ip -s link несколько раз с интервалом, определить конкретный интерфейс и скорость роста счётчиков; проверить ethtool/драйвер и порт сети при наличии доступа."
                      verification="Счётчики ошибок/дропов не должны заметно расти при нормальной нагрузке; ppm должен вернуться ниже порогов arm_info."
                      ;;'''
          new = '''        *сетевых\\ ошибок/учитываемых\\ потерь*)
                      cause="В оценке сети учитываются RX/TX errors, rx_missed_errors и tx_dropped. Общий rx_dropped выводится отдельно как диагностический счётчик и сам по себе не считается неисправностью, потому что может включать штатные L2/filter drops."
                      diagnostic="Проверить ip -s -s link и ethtool -S по конкретному интерфейсу. Особое внимание: rx_missed_errors, CRC/frame/FIFO/carrier и tx_dropped; общий rx_dropped сопоставлять с ними, а не трактовать отдельно как потерю полезного трафика."
                      verification="RX/TX errors, rx_missed_errors и tx_dropped не должны систематически расти при нормальной нагрузке; информационный rx_dropped может расти без снижения score, если учитываемые ошибки/потери остаются ниже порогов."
                      ;;'''
          if s.count(old) != 1:
              raise SystemExit('arm_info.sh: recommendation explanation block mismatch')
          s = s.replace(old, new, 1)

          old = '''if ((NET_ERROR_PPM>=NET_ERROR_WARN_PPM || NET_DROP_PPM>=NET_DROP_WARN_PPM)); then
              BAD_IF_TEXT=$(IFS=,;echo "${NET_BAD_IFACES[*]}")
              add_rec "ВНИМАНИЕ" "Повышенная доля сетевых ошибок/дропов" "Ошибки: ${NET_ERROR_PPM} ppm; дропы: ${NET_DROP_PPM} ppm. Возможны потери пакетов, медленная сеть и разрывы соединений." "Проверить кабель, порт коммутатора, согласование скорости/duplex и драйвер. ${BAD_IF_TEXT}" "ip -s link; ethtool IFACE_NAME 2>/dev/null"
          fi'''
          new = '''if ((NET_ERROR_PPM>=NET_ERROR_WARN_PPM || NET_DROP_PPM>=NET_DROP_WARN_PPM)); then
              BAD_IF_TEXT=$(IFS=,;echo "${NET_BAD_IFACES[*]}")
              add_rec "ВНИМАНИЕ" "Повышенная доля сетевых ошибок/учитываемых потерь" "Ошибки: ${NET_ERROR_PPM} ppm; учитываемые потери: ${NET_SCORED_LOSS_PPM} ppm. RX dropped: ${NET_RX_DROP_PPM_RAW} ppm (информационно, сам по себе не снижает оценку)." "Проверить кабель/порт, драйвер и детальные счётчики NIC: rx_missed_errors, CRC/frame/FIFO/carrier и tx_dropped. ${BAD_IF_TEXT}" "ip -s -s link; ethtool -S IFACE_NAME 2>/dev/null"
          fi'''
          if s.count(old) != 1:
              raise SystemExit('arm_info.sh: network recommendation block mismatch')
          s = s.replace(old, new, 1)

          old = ''' echo "RX ошибки|$RX_ERRORS_TOTAL"
           echo "TX ошибки|$TX_ERRORS_TOTAL"
           echo "RX дропы|$RX_DROPS_TOTAL"
           echo "TX дропы|$TX_DROPS_TOTAL"
           echo "Пакетов RX / TX|$RX_PACKETS_TOTAL / $TX_PACKETS_TOTAL"
           echo "Доля ошибок|${NET_ERROR_PPM} ppm"
           echo "Доля дропов|${NET_DROP_PPM} ppm"
           echo "Общая доля ошибок/дропов|${NET_BAD_PPM} ppm (${NET_BAD_PERCENT}%)"
           echo "Состояние|$NET_STATUS"'''
          new = ''' echo "RX ошибки|$RX_ERRORS_TOTAL"
           echo "TX ошибки|$TX_ERRORS_TOTAL"
           echo "RX dropped (информационно)|$RX_DROPS_TOTAL"
           echo "RX missed (учитывается)|$RX_MISSED_TOTAL"
           echo "TX dropped (учитывается)|$TX_DROPS_TOTAL"
           echo "Пакетов RX / TX|$RX_PACKETS_TOTAL / $TX_PACKETS_TOTAL"
           echo "Доля ошибок|${NET_ERROR_PPM} ppm"
           echo "RX dropped (информационно)|${NET_RX_DROP_PPM_RAW} ppm"
           echo "Учитываемые потери|${NET_SCORED_LOSS_PPM} ppm"
           echo "Общая учитываемая доля|${NET_BAD_PPM} ppm (${NET_BAD_PERCENT}%)"
           echo "Состояние|$NET_STATUS"'''
          if s.count(old) != 1:
              raise SystemExit('arm_info.sh: network text output block mismatch')
          s = s.replace(old, new, 1)

          old = '''    printf '  "network": {"active_interfaces":%s,"gateway":"%s","dns":"%s","error_ppm":%s,"drop_ppm":%s,"score":%s},\\n' \\
                  "$ACTIVE_NET" "$(json_escape "$GW_DISPLAY")" "$(json_escape "$DNS_DISPLAY")" "$NET_ERROR_PPM" "$NET_DROP_PPM" "$NET_SCORE"'''
          new = '''    printf '  "network": {"active_interfaces":%s,"gateway":"%s","dns":"%s","rx_dropped":%s,"rx_missed":%s,"tx_dropped":%s,"error_ppm":%s,"rx_drop_ppm_raw":%s,"scored_loss_ppm":%s,"drop_ppm":%s,"score":%s},\\n' \\
                  "$ACTIVE_NET" "$(json_escape "$GW_DISPLAY")" "$(json_escape "$DNS_DISPLAY")" "$RX_DROPS_TOTAL" "$RX_MISSED_TOTAL" "$TX_DROPS_TOTAL" "$NET_ERROR_PPM" "$NET_RX_DROP_PPM_RAW" "$NET_SCORED_LOSS_PPM" "$NET_DROP_PPM" "$NET_SCORE"'''
          if s.count(old) != 1:
              raise SystemExit('arm_info.sh: network JSON block mismatch')
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')

          # Tests: lock the intended semantics so rx_dropped cannot silently return to scoring.
          p = Path('tests/test_cli.sh')
          t = p.read_text(encoding='utf-8')
          anchor = '''grep -q '"verification"' "$SCRIPT" || die "base recommendation JSON verification"\n'''
          addition = '''grep -q '"verification"' "$SCRIPT" || die "base recommendation JSON verification"
          grep -Fq 'RX_MISSED_TOTAL=$((RX_MISSED_TOTAL+RXM))' "$SCRIPT" || die "network: rx_missed must be collected"
          grep -Fq 'SCORED_LOSSES_TOTAL=$((RX_MISSED_TOTAL+TX_DROPS_TOTAL))' "$SCRIPT" || die "network: scored losses must use rx_missed + tx_dropped"
          grep -Fq 'NET_RX_DROP_PPM_RAW=$((RX_DROPS_TOTAL*1000000/RX_PACKETS_TOTAL))' "$SCRIPT" || die "network: raw rx_dropped ppm missing"
          ! grep -Fq 'RXTX_DROPS=$((RX_DROPS_TOTAL+TX_DROPS_TOTAL))' "$SCRIPT" || die "network: rx_dropped returned to scored loss aggregate"
          '''
          if t.count(anchor) != 1:
              raise SystemExit('tests/test_cli.sh: insertion anchor mismatch')
          t = t.replace(anchor, addition, 1)
          old_py = "assert isinstance(d['network'],dict) and {'active_interfaces','gateway','dns','error_ppm','drop_ppm','score'} <= set(d['network'])"
          # This assertion actually lives in test_sections.sh; test_cli only provides static guards.
          p.write_text(t, encoding='utf-8')

          p = Path('tests/test_sections.sh')
          t = p.read_text(encoding='utf-8')
          t = t.replace('assert_contains "$BASE_TXT" "Общая доля ошибок/дропов"', 'assert_contains "$BASE_TXT" "Общая учитываемая доля"')
          old_py = "assert isinstance(d['network'],dict) and {'active_interfaces','gateway','dns','error_ppm','drop_ppm','score'} <= set(d['network'])"
          new_py = "assert isinstance(d['network'],dict) and {'active_interfaces','gateway','dns','rx_dropped','rx_missed','tx_dropped','error_ppm','rx_drop_ppm_raw','scored_loss_ppm','drop_ppm','score'} <= set(d['network'])"
          if t.count(old_py) != 1:
              raise SystemExit('tests/test_sections.sh: network JSON assertion mismatch')
          t = t.replace(old_py, new_py, 1)
          p.write_text(t, encoding='utf-8')

          replace_once(
              'docs/SCORING.md',
              'RX/TX errors и dropped нормализуются на количество пакетов (ppm). Это корректнее абсолютного накопленного счётчика. Gateway и DNS также учитываются.',
              'Для оценки сети RX/TX errors нормализуются на количество пакетов (ppm). Из потерь в score входят `rx_missed_errors` (пакеты, пропущенные host/NIC из-за нехватки RX-ресурсов) и `tx_dropped`. Общий `rx_dropped` остаётся диагностическим: Linux может учитывать в нём пакеты, отброшенные из-за неподдерживаемого протокола или L2-фильтрации, поэтому сам по себе этот счётчик не снижает score и не создаёт WARN. В отчёте отдельно показываются raw `rx_dropped` и учитываемые потери. Gateway и DNS также учитываются.'
          )

          replace_once(
              'README.md',
              '- сеть: IP/MAC, gateway, DNS, link, RX/TX errors и dropped, ppm;',
              '- сеть: IP/MAC, gateway, DNS, link, RX/TX errors, `rx_missed_errors`, TX dropped и информационный RX dropped; score учитывает только диагностически значимые ошибки/потери;'
          )

          p = Path('CHANGELOG.md')
          t = p.read_text(encoding='utf-8')
          marker = '- Добавлен постоянный CI-тест `tests/test_recommendation_commands.sh` для защиты командного контракта.\n'
          bullet = '- Исправлена логика RX drops: общий `rx_dropped` больше не считается самостоятельным признаком потери полезного трафика и не снижает сетевой score. Для оценки используются RX/TX errors, `rx_missed_errors` и `tx_dropped`; raw RX dropped остаётся в отчёте как информационный счётчик, а JSON дополнен `rx_drop_ppm_raw` и `scored_loss_ppm`.\n'
          if t.count(marker) != 1:
              raise SystemExit('CHANGELOG.md: insertion marker mismatch')
          t = t.replace(marker, bullet + marker, 1)
          p.write_text(t, encoding='utf-8')

          replace_once(
              'config/arm_info.conf.example',
              '# Сетевые ошибки/дропы на миллион пакетов.',
              '# Сетевые ошибки/учитываемые потери на миллион пакетов. NET_DROP_* применяется к rx_missed_errors + tx_dropped; raw rx_dropped только информационный.'
          )

          # The temporary workflow must not remain in the branch.
          Path('.github/workflows/apply-network-scoring-fix.yml').unlink()
          PY

          bash -n arm_info.sh tests/test_cli.sh tests/test_sections.sh
          bash tests/test_cli.sh
          git diff --check

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "arm_info-ci"
          git config user.email "157384758+NewMishka@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: stop scoring informational RX drops"
          git push origin HEAD:feature/v1.2.4-command-audit

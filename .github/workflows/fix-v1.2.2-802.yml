name: Refine v1.2.2 802.1X report

on:
  push:
    branches:
      - feature/v1.2.2-corp-report
    paths:
      - .github/scripts/fix_v1_2_2_802.py
      - .github/workflows/fix-v1.2.2-802.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v1.2.2-corp-report
      - name: Apply refinement
        run: python3 .github/scripts/fix_v1_2_2_802.py
      - name: Validate
        run: |
          bash -n arm_info.sh
          bash tests/test_cli.sh
          bash tests/test_enterprise.sh
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add arm_info.sh
          git diff --cached --quiet && exit 0
          git commit -m 'fix: refine 802.1X certificate report in v1.2.2'
          git push

name: Fix explicit save patch runner

on:
  push:
    branches: [feature/v1.2.4-command-audit]
    paths:
      - .github/workflows/fix-save-workflow.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v1.2.4-command-audit
          fetch-depth: 0
      - name: Fix runner
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/apply-save-opt-in.yml')
          s=p.read_text(encoding='utf-8')
          old="""          s = must_replace(s, '        --no-save) SAVE_REPORT=0; shift ;;', '        -s|--save) SAVE_REPORT=1; shift ;;', 'enterprise save switch', count=1)\n          s = must_replace(s, '        --no-save) SAVE_REPORT=0; shift ;;', '        -s|--save) SAVE_REPORT=1; shift ;;', 'standard save switch', count=1)\n"""
          new="""          s = must_replace(s, '        --no-save) SAVE_REPORT=0; shift ;;', '        -s|--save) SAVE_REPORT=1; shift ;;', 'save switches', count=2)\n"""
          if old not in s:
              raise SystemExit('target block not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          git config user.name arm_info-ci
          git config user.email 157384758+NewMishka@users.noreply.github.com
          git rm .github/workflows/fix-save-workflow.yml
          git add .github/workflows/apply-save-opt-in.yml
          git commit -m "ci: fix explicit save patch runner"
          git push origin HEAD:feature/v1.2.4-command-audit

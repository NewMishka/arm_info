name: One-shot CIFS stabilization

on:
  push:
    branches:
      - feature/v1.2.4-command-audit
    paths:
      - tools/apply-cifs-stabilization.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v1.2.4-command-audit
      - name: Apply CIFS stabilization patch
        run: python3 tools/apply-cifs-stabilization.py
      - name: Validate
        run: |
          bash -n arm_info.sh tests/test_cifs_probe.sh tests/cifs_field_probe.sh
          bash tests/test_cifs_probe.sh
      - name: Commit generated production changes
        run: |
          if git diff --quiet; then
            echo 'No generated changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add arm_info.sh tests/test_cifs_probe.sh tests/cifs_field_probe.sh CHANGELOG.md
          git commit -m 'fix: harden CIFS availability checks'
          git push origin HEAD:feature/v1.2.4-command-audit

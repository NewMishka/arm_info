name: Apply v1.2.3 field fixes

on:
  push:
    branches:
      - feature/v1.2.3-system-storage-priority
    paths:
      - '.github/scripts/apply_v1_2_3_field_fixes.py'
      - '.github/workflows/apply-v1.2.3-field-fixes.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v1.2.3-system-storage-priority
      - name: Apply field fixes
        run: python3 .github/scripts/apply_v1_2_3_field_fixes.py
      - name: Validate
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y shellcheck >/dev/null
          bash -n arm_info.sh tests/test_cli.sh tests/test_enterprise.sh
          shellcheck --severity=error arm_info.sh tests/test_cli.sh tests/test_enterprise.sh
          bash tests/test_cli.sh
          bash tests/test_enterprise.sh
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add arm_info.sh CHANGELOG.md docs/releases/v1.2.3.md tests/test_cli.sh tests/test_enterprise.sh
          git diff --cached --quiet && exit 0
          git commit -m 'fix: correct system disk role and broaden 802.1X discovery'
          git push

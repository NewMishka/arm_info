name: Apply corp alias docs v1.2.1

on:
  push:
    branches: [feature/single-file-v1.2.1]
    paths:
      - .github/workflows/apply-corp-alias-v121.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update docs and tests
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('README.md'); s=p.read_text(encoding='utf-8')
          s=s.replace('Для переноса на проверяемый АРМ достаточно одного файла: `sudo bash arm_info.sh --profile enterprise`.',
                      'Для переноса на проверяемый АРМ достаточно одного файла: `sudo bash arm_info.sh --corp`. Полная форма `--profile enterprise` сохранена для совместимости.')
          s=s.replace('--config PATH\n--profile domain|network|print|software|enterprise',
                      '--config PATH\n--corp\n--profile domain|network|print|software|enterprise')
          s=s.replace('sudo arm_info --profile enterprise --privacy --json -o /tmp/arm-enterprise.json',
                      'sudo arm_info --corp --privacy --json -o /tmp/arm-enterprise.json')
          s=s.replace('`enterprise` — объединяет `domain + network + print`; глобальная инвентаризация ПО запускается отдельно через `--profile software`.',
                      '`enterprise` / `--corp` — объединяет `domain + network + print`; глобальная инвентаризация ПО **не запускается автоматически** и доступна только отдельно через `--profile software`.')
          s=s.replace('sudo arm_info --profile enterprise --privacy --json -o arm-a.json\nsudo arm_info --profile enterprise --privacy --json -o arm-b.json',
                      'sudo arm_info --corp --privacy --json -o arm-a.json\nsudo arm_info --corp --privacy --json -o arm-b.json')
          p.write_text(s,encoding='utf-8')

          p=Path('docs/ENTERPRISE_PROFILES.md'); s=p.read_text(encoding='utf-8')
          note='\nКороткий запуск полного корпоративного профиля: `sudo arm_info --corp`. Он эквивалентен `--profile enterprise` и включает только `domain + network + print`. Инвентаризация ПО выполняется только по явному `--profile software`.\n'
          if note.strip() not in s:
              marker='> **С версии 1.2.1 все профили встроены в `arm_info.sh`. На проверяемый АРМ достаточно перенести один файл; `arm_info-enterprise.sh` больше не требуется.**\n'
              s=s.replace(marker, marker+note, 1)
          p.write_text(s,encoding='utf-8')

          p=Path('tests/test_enterprise.sh'); s=p.read_text(encoding='utf-8')
          needle='[[ $(bash "$SCRIPT" --profile domain --version) == "arm_info enterprise $EXPECTED_VERSION" ]] || die "--version"\n'
          add='[[ $(bash "$SCRIPT" --corp --version) == "arm_info enterprise $EXPECTED_VERSION" ]] || die "--corp version"\n'
          if add not in s: s=s.replace(needle, needle+add, 1)
          needle2="bash \"$SCRIPT\" --profile domain --help | grep -q -- '--profile enterprise' || die \"--help profiles\"\n"
          add2="bash \"$SCRIPT\" --corp --help | grep -q -- '--corp' || die \"--corp help\"\ngrep -q 'enterprise) check_domain; check_network; check_print ;;' \"$SCRIPT\" || die \"enterprise profile must exclude software inventory\"\n"
          if add2 not in s: s=s.replace(needle2, needle2+add2, 1)
          p.write_text(s,encoding='utf-8')

          p=Path('CHANGELOG.md'); s=p.read_text(encoding='utf-8')
          marker='- Сценарий работы по SSH упрощён: на проверяемый АРМ достаточно передать один `arm_info.sh`.\n'
          extra='- Добавлен короткий ключ `--corp`, эквивалентный `--profile enterprise`.\n- Инвентаризация ПО не входит в `--corp`/`enterprise` и запускается только явно через `--profile software`.\n'
          if extra not in s: s=s.replace(marker, marker+extra, 1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate
        run: |
          bash -n arm_info.sh tests/test_enterprise.sh
          test "$(bash arm_info.sh --corp --version)" = "arm_info enterprise 1.2.1"
          bash tests/test_enterprise.sh
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/ENTERPRISE_PROFILES.md tests/test_enterprise.sh CHANGELOG.md
          git commit -m "docs: clarify --corp and explicit software inventory"
          git push

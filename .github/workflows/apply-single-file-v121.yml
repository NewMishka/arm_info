name: Finalize single-file v1.2.1

on:
  push:
    branches: [feature/single-file-v1.2.1]
    paths:
      - .github/workflows/apply-single-file-v121.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update packaging tests and docs
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def rw(path, pairs):
              p=Path(path); s=p.read_text(encoding='utf-8')
              for a,b in pairs: s=s.replace(a,b)
              p.write_text(s,encoding='utf-8')

          rw('Makefile', [
              ('arm_info.sh arm_info-enterprise.sh install.sh','arm_info.sh install.sh'),
          ])

          rw('packaging/build-rpm.sh', [
              ('install -m0644 "$ROOT/arm_info-enterprise.sh" "$TOP/SOURCES/arm_info-enterprise.sh"\n',''),
          ])

          rw('packaging/arm_info.spec', [
              ('Version:        1.2.0','Version:        1.2.1'),
              ('Source4:        arm_info-enterprise.sh\n',''),
              ('install -Dm0755 %{SOURCE4} %{buildroot}%{_libexecdir}/arm_info/arm_info-enterprise.sh\n',''),
              ('%{_libexecdir}/arm_info/arm_info-enterprise.sh\n',''),
              ('Version 1.2 adds enterprise profiles','Version 1.2 adds embedded enterprise profiles'),
              ('%changelog\n','%changelog\n* Tue Sep 15 2026 NewMishka - 1.2.1-1\n- Single-file distribution: enterprise profiles are embedded in arm_info\n\n'),
          ])

          rw('tests/test_enterprise.sh', [
              ('SCRIPT="$ROOT/arm_info-enterprise.sh"','SCRIPT="$ROOT/arm_info.sh"\nEXPECTED_VERSION=$(tr -d \'[:space:]\' < "$ROOT/VERSION")'),
              ('[[ $(bash "$SCRIPT" --version) == "arm_info enterprise 1.2.0" ]] || die "--version"','[[ $(bash "$SCRIPT" --profile domain --version) == "arm_info enterprise $EXPECTED_VERSION" ]] || die "--version"'),
              ('bash "$SCRIPT" --help | grep -q -- \'--profile enterprise\' || die "--help profiles"','bash "$SCRIPT" --profile domain --help | grep -q -- \'--profile enterprise\' || die "--help profiles"'),
              ('python3 - "$TMP1" <<\'PY\'','python3 - "$TMP1" "$EXPECTED_VERSION" <<\'PY\''),
              ("assert d['version']=='1.2.0'","assert d['version']==sys.argv[2]"),
          ])

          rw('.github/workflows/ci.yml', [
              ('bash -n arm_info.sh arm_info-enterprise.sh install.sh','bash -n arm_info.sh install.sh'),
              ('shellcheck --severity=error arm_info.sh arm_info-enterprise.sh install.sh','shellcheck --severity=error arm_info.sh install.sh'),
              ('bash -n /src/arm_info.sh && bash -n /src/arm_info-enterprise.sh','bash -n /src/arm_info.sh'),
              ('          test "$V" = "$(sed -n \'s/^VERSION="\\([^\"]*\\)"/\\1/p\' arm_info-enterprise.sh | head -1)"\n',''),
              ('          test -x "$D/usr/local/libexec/arm_info/arm_info-enterprise.sh"\n',''),
              ('          test ! -e "$D/usr/local/libexec/arm_info/arm_info-enterprise.sh"\n',''),
              ("arm_info-enterprise.sh\n          ! grep -Eq 'Kerberos 6/7/15|c6=|c7=|c15=' arm_info-enterprise.sh","arm_info.sh\n          ! grep -Eq 'Kerberos 6/7/15|c6=|c7=|c15=' arm_info.sh\n          test ! -e arm_info-enterprise.sh\n          grep -q 'enterprise-profile-dispatch-v1.2.1' arm_info.sh"),
              ('            rpm -qpl "$RPM" | grep -q "arm_info-enterprise.sh"\n','            ! rpm -qpl "$RPM" | grep -q "arm_info-enterprise.sh"\n'),
          ])

          rw('README.md', [
              ('Скрипт сохраняет совместимость с прежним сценарием: его содержимое можно целиком вставить в Bash после `su -`. Enterprise-профили требуют установленного рядом helper `arm_info-enterprise.sh`, поэтому для них рекомендуется запуск из клонированного репозитория или после `install.sh`.','Начиная с версии **1.2.1** вся базовая и корпоративная диагностика находится в одном `arm_info.sh`. Для переноса на проверяемый АРМ достаточно одного файла: `sudo bash arm_info.sh --profile enterprise`. Установка через `install.sh` остаётся доступной, но отдельный enterprise-helper больше не требуется.'),
              ('`arm_info 1.2.0` добавляет отдельные профили','`arm_info 1.2.1` содержит встроенные профили'),
              ('Текущая версия: **1.2.0**.','Текущая версия: **1.2.1**.'),
              ('- enterprise-профили: AD/SSSD/Kerberos/DNS, 802.1X, CIFS/GVFS и CUPS;','- enterprise-профили в том же единственном файле: AD/SSSD/Kerberos/DNS, 802.1X, CIFS/GVFS и CUPS;'),
          ])

          p=Path('docs/ENTERPRISE_PROFILES.md'); s=p.read_text(encoding='utf-8')
          note='\n> **С версии 1.2.1 все профили встроены в `arm_info.sh`. На проверяемый АРМ достаточно перенести один файл; `arm_info-enterprise.sh` больше не требуется.**\n'
          anchor='Они не входят в аппаратный health score и предназначены для оперативной диагностики инфраструктурных проблем.\n'
          if note.strip() not in s: s=s.replace(anchor,anchor+note,1)
          p.write_text(s,encoding='utf-8')

          p=Path('CHANGELOG.md'); s=p.read_text(encoding='utf-8')
          block='## 1.2.1 — 2026-09-15\n\n### Changed\n- `arm_info.sh` стал полностью автономным: base + `domain/network/print/software/enterprise` + `--compare` находятся в одном файле.\n- Для запуска enterprise-профилей больше не требуется `arm_info-enterprise.sh` или каталог `libexec`.\n- Installer, RPM, CI, tests и GitHub Release переведены на однофайловую поставку.\n- Сценарий работы по SSH упрощён: на проверяемый АРМ достаточно передать один `arm_info.sh`.\n\n'
          if '## 1.2.1 — 2026-09-15' not in s: s=s.replace('# Changelog\n\n','# Changelog\n\n'+block,1)
          s=s.replace('- Инвентаризация корпоративного ПО: R7, Citrix/ICAClient, Remmina/FreeRDP, браузеры, Basis Workplace, Crypto/Token middleware и SNX.','- Глобальная инвентаризация всех установленных RPM-пакетов без списка заранее заданного ПО.')
          p.write_text(s,encoding='utf-8')

          Path('docs/releases/v1.2.1.md').write_text('# arm_info 1.2.1\n\nОднофайловая поставка для удалённой диагностики АРМ.\n\n- `arm_info.sh` содержит базовую и enterprise-диагностику;\n- встроены профили `domain`, `network`, `print`, `software`, `enterprise`;\n- встроен `--compare`;\n- внешний `arm_info-enterprise.sh` и `libexec` больше не требуются;\n- installer/RPM/CI переведены на один исполняемый файл.\n\nТиповой запуск по SSH:\n\n```bash\nscp arm_info.sh admin@HOST:/tmp/\nssh admin@HOST\nsudo bash /tmp/arm_info.sh --profile enterprise\n```\n',encoding='utf-8')
          PY
      - name: Validate
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y shellcheck >/dev/null
          bash -n arm_info.sh install.sh tests/test_cli.sh tests/test_enterprise.sh packaging/build-rpm.sh
          shellcheck --severity=error arm_info.sh install.sh tests/test_cli.sh tests/test_enterprise.sh packaging/build-rpm.sh
          test ! -e arm_info-enterprise.sh
          test "$(tr -d '[:space:]' < VERSION)" = "1.2.1"
          bash tests/test_cli.sh
          bash tests/test_enterprise.sh
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: finalize single-file packaging and tests"
          git push

name: Apply single-file v1.2.1

on:
  push:
    branches: [feature/single-file-v1.2.1]
    paths:
      - .github/workflows/apply-single-file-v121.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Embed enterprise code into arm_info.sh
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('arm_info.sh')
          h=Path('arm_info-enterprise.sh')
          s=p.read_text(encoding='utf-8')
          e=h.read_text(encoding='utf-8')
          lines=e.splitlines()
          if lines and lines[0].startswith('#!'):
              lines=lines[1:]
          e='\n'.join(lines).rstrip()+'\n'
          e=e.replace('arm_info enterprise profiles — v1.2.0','arm_info enterprise profiles — v1.2.1')
          e=e.replace('VERSION="1.2.0"','VERSION="1.2.1"',1)
          e=e.replace('arm_info enterprise profiles 1.2.0','arm_info enterprise profiles 1.2.1')
          start=s.index('# enterprise-profile-dispatch-v1.2')
          marker='# -------------------- НАСТРОЙКИ ПО УМОЛЧАНИЮ --------------------'
          end=s.index(marker,start)
          block=(
              '# enterprise-profile-dispatch-v1.2.1 — single-file edition\n'
              '# Enterprise-профили встроены в arm_info.sh; внешний helper не требуется.\n'
              '_arm_enterprise_run() (\n'+e+')\n\n'
              '_arm_enterprise_requested=0\n'
              'for _arm_arg in "$@"; do\n'
              '    case "$_arm_arg" in\n'
              '        --profile|--profile=*|--compare) _arm_enterprise_requested=1; break ;;\n'
              '    esac\n'
              'done\n'
              'if ((_arm_enterprise_requested)); then\n'
              '    _arm_enterprise_run "$@"\n'
              '    exit $?\n'
              'fi\n\n'
          )
          s=s[:start]+block+s[end:]
          s=s.replace('# arm_info 1.2.0 —','# arm_info 1.2.1 —',1)
          s=s.replace('ARM_INFO_VERSION="1.2.0"','ARM_INFO_VERSION="1.2.1"',1)
          s=s.replace('# Запуск: через bash-файл или целиком вставить в root-терминал.','# Запуск: исполняемый Bash-файл; base и enterprise находятся в одном файле.',1)
          p.write_text(s,encoding='utf-8')
          h.unlink()
          Path('VERSION').write_text('1.2.1\n',encoding='utf-8')
          PY
          bash -n arm_info.sh
          test ! -e arm_info-enterprise.sh
          bash arm_info.sh --version | grep -q '1.2.1'
          bash arm_info.sh --profile domain --help | grep -q -- '--profile enterprise'
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: embed enterprise profiles into arm_info 1.2.1"
          git push

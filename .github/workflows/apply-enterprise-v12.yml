name: Apply enterprise v1.2 core patch

on:
  push:
    branches:
      - feature/enterprise-profiles-v1.2.0
    paths:
      - tools/patch-core-v1.2.py
      - .github/workflows/apply-enterprise-v12.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch arm_info.sh
        run: python3 tools/patch-core-v1.2.py
      - name: Validate syntax
        run: bash -n arm_info.sh
      - name: Commit generated core change
        run: |
          if git diff --quiet -- arm_info.sh; then
            echo "Core already patched"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add arm_info.sh
          git commit -m "feat: dispatch enterprise profiles from arm_info"
          git push
